[workspace]
resolver = "2"
members = [
    "crates/intent-rebase-types",
    "crates/intent-service",
    "crates/intent-api",
    "crates/rebase-engine",
    "crates/graph-service",
    "crates/runtime-adapter",
    "crates/rebase-orchestrator",
    "crates/compensation-service",
    "crates/forensic-service",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Intent Rebase Engine Team"]
repository = "https://github.com/BrianNguyen29/intent-rebase"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# JSON Schema generation
schemars = "0.8"

# Runtime validation
validator = { version = "0.18", features = ["derive"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "tls-rustls"] }

# HTTP framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
http = "1.0"

# NATS
nats = "0.33"

# S3 / object store
aws-config = "1.0"
aws-sdk-s3 = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
opentelemetry = "0.24"
opentelemetry-otlp = "0.17"
opentelemetry_sdk = "0.24"
metrics = "0.23"
metrics-exporter-prometheus = "0.12"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utils
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
sha2 = "0.10"
once_cell = "1.19"
futures-util = "0.3"

# Temporal
temporalio-client = "0.2.0"
temporalio-common = "0.2.0"
temporalio-sdk-core = "0.2.0"

[profile.release]
lto = "fat"
codegen-units = 1
