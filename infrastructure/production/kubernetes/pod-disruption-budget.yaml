# PDB manifest — APPLIED on 2026-06-18.
# Node pool scaled to 2; PDB minAvailable=1 is now satisfiable. Allowed disruptions
# reported as 0 when only one replica is running (HPA minimum). RollingUpdate with
# maxSurge:1, maxUnavailable:0 means a second pod can be scheduled before the old
# one terminates, so drains are not blocked indefinitely.
#
# If node pool is scaled back to 1, a node drain will block because the PDB cannot
# be satisfied with a second pod. Do not apply PDB on single-node clusters.

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: intent-api
  namespace: intent-rebase
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: intent-api
