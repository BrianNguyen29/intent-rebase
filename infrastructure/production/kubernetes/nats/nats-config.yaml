apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: intent-rebase
data:
  nats.conf: |
    jetstream: {
      store_dir: "/data/jetstream"
      max_memory_store: 1GB
      max_file_store: 10GB
    }

    # No clustering (single-node pilot)
    # No auth for pilot (internal ClusterIP only)
    # Production would require auth/accounts

    # Logging
    debug: false
    trace: false

    # HTTP monitoring port (internal only)
    http_port: 8222
