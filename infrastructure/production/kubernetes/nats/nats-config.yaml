apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: intent-rebase
data:
  nats.conf: |
    jetstream: {
      store_dir: "/data/jetstream"
      max_memory_store: 1GB
      max_file_store: 10GB
    }

    # Internal token auth (private ClusterIP only; no TLS/HA)
    # Token is supplied via NATS_TOKEN env var; reference uses ${NATS_TOKEN}.
    # StatefulSet entrypoint performs shell substitution before NATS startup.
    authorization: {
      token: "${NATS_TOKEN}"
    }

    # No clustering (single-node pilot)
    # Production would require TLS/mTLS, accounts, and HA clustering

    # Logging
    debug: false
    trace: false

    # HTTP monitoring port (internal only; no auth by default)
    http_port: 8222
