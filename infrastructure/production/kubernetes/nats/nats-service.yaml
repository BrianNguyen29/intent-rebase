apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: intent-rebase
  labels:
    app: nats
    component: jetstream-pilot
spec:
  type: ClusterIP
  selector:
    app: nats
    component: jetstream-pilot
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: monitor
    port: 8222
    targetPort: 8222
  # INTERNAL ONLY: ClusterIP, no external LB, no public ingress
  # Production NATS would use a headless service for clustering
