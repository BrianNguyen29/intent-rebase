# NATS HA Cluster Config — NOT APPLIED by default.
# Safe hardening artifact for future 3-node HA clustering.
# Requires headless service, anti-affinity, multiple PVCs, and SRE review.
# Do not apply without owner approval and A-03 SRE signoff.
# Private-only. No production-ready claim.
#
# If applied, replace the existing `nats-config` ConfigMap with this file
# and update `nats-statefulset.yaml` to:
#   - replicas: 3
#   - podAntiAffinity
#   - cluster port (6222)
#   - headless service (ClusterIP: None)

apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config-ha
  namespace: intent-rebase
  annotations:
    note: "NOT APPLIED by default. Optional future HA config."
data:
  nats.conf: |
    jetstream: {
      store_dir: "/data/jetstream"
      max_memory_store: 1GB
      max_file_store: 10GB
    }

    # Cluster configuration for HA (3-node)
    cluster: {
      name: nats-cluster
      listen: 0.0.0.0:6222
      routes: [
        "nats-route://nats-0.nats:6222"
        "nats-route://nats-1.nats:6222"
        "nats-route://nats-2.nats:6222"
      ]
    }

    # Internal token auth (placeholder for future TLS/mTLS)
    # Token is supplied via NATS_TOKEN env var; reference uses ${NATS_TOKEN}.
    # StatefulSet entrypoint performs shell substitution before NATS startup.
    authorization: {
      token: "${NATS_TOKEN}"
    }

    # Logging
    debug: false
    trace: false

    # HTTP monitoring port (internal only; no auth by default)
    http_port: 8222
