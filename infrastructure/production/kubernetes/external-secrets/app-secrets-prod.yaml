# ExternalSecret for prod app-secrets — APPLIED on 2026-06-19.
# Syncs Google Secret Manager secrets into the existing Kubernetes Secret
# `app-secrets` in namespace `intent-rebase`.
# Uses `creationPolicy: Merge` so existing keys are preserved and GSM keys
# are added/updated. `deletionPolicy: Retain` so the Secret is not deleted
# when this ExternalSecret is removed.
# ESO controller + ClusterSecretStore `gcp-secret-manager` are installed.
# Status: Ready=True, SecretSynced.
# Do not commit real secret values.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: intent-rebase
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: app-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: intent-rebase-prod-database-url
    - secretKey: JWT_SECRET
      remoteRef:
        key: intent-rebase-prod-jwt-secret
    - secretKey: API_KEY
      remoteRef:
        key: intent-rebase-prod-api-key
    - secretKey: INTENT_API_WEBHOOK_HMAC_SECRET
      remoteRef:
        key: intent-rebase-prod-intent-api-webhook-hmac-secret
    - secretKey: NATS_TOKEN
      remoteRef:
        key: intent-rebase-prod-nats-token
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: intent-rebase-prod-slack-webhook-url
    - secretKey: slack_webhook_url
      remoteRef:
        key: intent-rebase-prod-slack-webhook-url
    - secretKey: SMTP_HOST
      remoteRef:
        key: intent-rebase-prod-smtp-host
    - secretKey: smtp_host
      remoteRef:
        key: intent-rebase-prod-smtp-host
    - secretKey: SMTP_PORT
      remoteRef:
        key: intent-rebase-prod-smtp-port
    - secretKey: smtp_port
      remoteRef:
        key: intent-rebase-prod-smtp-port
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: intent-rebase-prod-smtp-username
    - secretKey: smtp_username
      remoteRef:
        key: intent-rebase-prod-smtp-username
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: intent-rebase-prod-smtp-password
    - secretKey: smtp_password
      remoteRef:
        key: intent-rebase-prod-smtp-password
    - secretKey: SMTP_FROM
      remoteRef:
        key: intent-rebase-prod-smtp-from
    - secretKey: smtp_from
      remoteRef:
        key: intent-rebase-prod-smtp-from
    - secretKey: SMTP_TO
      remoteRef:
        key: intent-rebase-prod-smtp-to
    - secretKey: smtp_to
      remoteRef:
        key: intent-rebase-prod-smtp-to
