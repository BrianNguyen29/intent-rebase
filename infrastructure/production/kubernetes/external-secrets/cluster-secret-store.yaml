# ClusterSecretStore for Google Secret Manager — APPLIED on 2026-06-19.
# ESO v2.6.0 controller installed via server-side apply from static manifest:
#   kubectl apply --server-side -f \
#     https://github.com/external-secrets/external-secrets/releases/download/v2.6.0/external-secrets.yaml
# Release landed in namespace `default`.
# This ClusterSecretStore uses Application Default Credentials (ADC).
# On GKE with Workload Identity disabled, ADC falls back to the node service
# account (production-template-gke-sa@ferrum-497801.iam.gserviceaccount.com)
# which already has roles/secretmanager.secretAccessor.
# Do not commit real credentials.

apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: ferrum-497801
      # No auth block: uses ADC / node service account fallback.
      # Workload Identity is disabled on this cluster; node SA is granted
      # roles/secretmanager.secretAccessor.
