# ExternalSecret for staging app-secrets — APPLIED on 2026-06-19.
# Syncs Google Secret Manager secrets into the existing Kubernetes Secret
# `app-secrets` in namespace `intent-rebase-staging`.
# Uses `creationPolicy: Merge` so existing keys are preserved and GSM keys
# are added/updated. `deletionPolicy: Retain` so the Secret is not deleted
# when this ExternalSecret is removed.
# ESO controller + ClusterSecretStore `gcp-secret-manager` are installed.
# Status: Ready=True, SecretSynced.
# Staging secret rotation validated: GSM secret `intent-rebase-staging-api-key`
# rotated to version [2]; forced sync via annotation; hash comparison matched
# without printing secret (`STAGING_API_KEY_ROTATION_MATCH=true`); Deployment
# restarted; new pod `intent-api-854f7bf87f-2wl6n`; smoke after rotation passed
# (`STAGING_ROTATION_SMOKE_OK`). Prod rotation was NOT performed.
# Do not commit real secret values.

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: intent-rebase-staging
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: app-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: intent-rebase-staging-database-url
    - secretKey: JWT_SECRET
      remoteRef:
        key: intent-rebase-staging-jwt-secret
    - secretKey: API_KEY
      remoteRef:
        key: intent-rebase-staging-api-key
    - secretKey: INTENT_API_WEBHOOK_HMAC_SECRET
      remoteRef:
        key: intent-rebase-staging-intent-api-webhook-hmac-secret
    - secretKey: SLACK_WEBHOOK_URL
      remoteRef:
        key: intent-rebase-staging-slack-webhook-url
    - secretKey: slack_webhook_url
      remoteRef:
        key: intent-rebase-staging-slack-webhook-url
    - secretKey: SMTP_HOST
      remoteRef:
        key: intent-rebase-staging-smtp-host
    - secretKey: smtp_host
      remoteRef:
        key: intent-rebase-staging-smtp-host
    - secretKey: SMTP_PORT
      remoteRef:
        key: intent-rebase-staging-smtp-port
    - secretKey: smtp_port
      remoteRef:
        key: intent-rebase-staging-smtp-port
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: intent-rebase-staging-smtp-username
    - secretKey: smtp_username
      remoteRef:
        key: intent-rebase-staging-smtp-username
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: intent-rebase-staging-smtp-password
    - secretKey: smtp_password
      remoteRef:
        key: intent-rebase-staging-smtp-password
    - secretKey: SMTP_FROM
      remoteRef:
        key: intent-rebase-staging-smtp-from
    - secretKey: smtp_from
      remoteRef:
        key: intent-rebase-staging-smtp-from
    - secretKey: SMTP_TO
      remoteRef:
        key: intent-rebase-staging-smtp-to
    - secretKey: smtp_to
      remoteRef:
        key: intent-rebase-staging-smtp-to
