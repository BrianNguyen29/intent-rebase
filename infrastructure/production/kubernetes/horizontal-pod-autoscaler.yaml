# HPA manifest — APPLIED on 2026-06-18.
# Node pool scaled to 2; HPA metrics active: CPU 2%/70%, memory 2%/80%,
# minReplicas 1, maxReplicas 3. Conditions AbleToScale True, ScalingActive True.
# Deployment strategy is RollingUpdate with maxSurge:1, maxUnavailable:0.
#
# NOTE: HPA works with RollingUpdate; scaling events will roll the pod with zero
# downtime when node pool capacity is sufficient. Do not revert to Recreate while
# HPA is active. Apply only if node pool >= 2.

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intent-api
  namespace: intent-rebase
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intent-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
