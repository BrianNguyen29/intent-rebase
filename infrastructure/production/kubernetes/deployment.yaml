# INTERNAL SMOKE DEPLOY ONLY — not production-ready.
# Apply only after out-of-band secret `app-secrets` and ConfigMap `intent-rebase-migrations` exist.
# Do not commit real secret values into this repository.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-api
  namespace: intent-rebase
  labels:
    app: intent-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    # RollingUpdate requires node pool >= 2 to avoid scheduling conflicts.
    # Node pool scaled to 2; HPA and PDB applied. RollingUpdate is active.
  selector:
    matchLabels:
      app: intent-api
  template:
    metadata:
      labels:
        app: intent-api
    spec:
      containers:
        - name: intent-api
          # Image tag :cd370d1-metrics includes HTTP metrics instrumentation
          # (http_requests_total + http_request_duration_seconds) for Prometheus SLO rules.
          # Built from working tree at commit cd370d1 with uncommitted metrics middleware changes.
          image: us-central1-docker.pkg.dev/ferrum-497801/intent-rebase/intent-api:cd370d1-metrics
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: INTENT_API_BIND_ADDR
              value: "0.0.0.0:8080"
            - name: INTENT_API_REQUIRE_JWT
              value: "true"
            - name: RUST_LOG
              value: "info"
            - name: NATS_URL
              value: "nats://nats:4222"
            - name: INTENT_API_NATS_CONSUMER
              value: "true"
          envFrom:
            - secretRef:
                name: app-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              # Reduced from 100m to 50m to allow scheduling on the 2-node GKE cluster.
              # Revisit when the node pool grows or RollingUpdate scheduling is no longer constrained.
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
# Note: This Deployment targets a single internal replica for smoke validation.
# Scale, HPA, podDisruptionBudget, and rolling-update tuning are Phase 1
# hardening changes pending orchestrator apply (node pool >= 2).
