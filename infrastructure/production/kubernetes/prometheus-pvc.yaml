# Prometheus PVC — APPLIED on 2026-06-22.
# Provides persistent storage for Prometheus TSDB so data survives pod restarts.
# Retention is configured via Prometheus args (default 15 days). Not production-grade
# HA; single-replica Prometheus is acceptable for private-only solo operation.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-storage
  namespace: intent-rebase
  labels:
    app: prometheus
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  # Default StorageClass in GKE is standard-rwo (SSD-backed). If using
  # a regional cluster or requiring HA, use a multi-writer volume or a
  # stateful set with separate PVCs per replica. Not needed here.
  storageClassName: standard-rwo
