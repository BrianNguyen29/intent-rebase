# Migration-only Job using the intent-api binary.
# Migrations are embedded at compile time via sqlx::migrate!; the image must be
# rebuilt when migration files change to include the new revision.
#
# ⚠️ IMAGE TAG: The tag `c166e57` below is the smoke-deploy image that does NOT
# contain the `INTENT_API_RUN_MIGRATIONS=true` migration-only mode. Before
# applying this Job, replace the image with a newly built/pushed image that
# includes the migration-mode code (e.g., rebuild from the commit that added
# `INTENT_API_RUN_MIGRATIONS` support and push a new tag).
#
# CAVEAT: This Job uses the intent-api image with INTENT_API_RUN_MIGRATIONS=true.
# It populates the `_sqlx_migrations` metadata table. If the database was
# previously migrated using the raw-psql Job (postgres:16-alpine), sqlx may
# fail because tables already exist but `_sqlx_migrations` is absent. For
# databases already raw-applied, a baseline/repair step (e.g., recreating from
# a clean backup or running sqlx::migrate! against a fresh DB) is required.
# This standard Job is intended for future clean deploys after the image is rebuilt.
#
# Apply this Job before starting the intent-api Deployment:
#   kubectl apply -f infrastructure/production/kubernetes/migration-job.yaml

apiVersion: batch/v1
kind: Job
metadata:
  name: intent-rebase-migrations
  namespace: intent-rebase
spec:
  template:
    metadata:
      labels:
        app: intent-rebase-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: us-central1-docker.pkg.dev/ferrum-497801/intent-rebase/intent-api:c166e57
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: INTENT_API_RUN_MIGRATIONS
              value: "true"
            - name: RUST_LOG
              value: "info"
          command:
            - /app/intent-api
  backoffLimit: 1
