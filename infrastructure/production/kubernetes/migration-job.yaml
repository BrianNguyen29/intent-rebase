# Migration-only Job using the intent-api binary.
# Migrations are embedded at compile time via sqlx::migrate!; the image must be
# rebuilt when migration files change to include the new revision.
#
# ⚠️ LIVE DB CAVEAT: The database was previously migrated using a raw-psql Job
# (postgres:16-alpine). sqlx::migrate! may fail against this existing DB because
# tables already exist but `_sqlx_migrations` metadata is absent. A baseline/repair
# step (e.g., recreating from a clean backup or applying to a fresh DB) is
# required before this Job can be applied against the live instance. This Job is
# intended for future clean deploys or fresh databases after the live DB gap is
# resolved.
#
# Apply this Job before starting the intent-api Deployment:
#   kubectl apply -f infrastructure/production/kubernetes/migration-job.yaml

apiVersion: batch/v1
kind: Job
metadata:
  name: intent-rebase-migrations
  namespace: intent-rebase
spec:
  template:
    metadata:
      labels:
        app: intent-rebase-migrations
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: us-central1-docker.pkg.dev/ferrum-497801/intent-rebase/intent-api:9e26aaa
          envFrom:
            - secretRef:
                name: app-secrets
          env:
            - name: INTENT_API_RUN_MIGRATIONS
              value: "true"
            - name: RUST_LOG
              value: "info"
          command:
            - /app/intent-api
  backoffLimit: 1
