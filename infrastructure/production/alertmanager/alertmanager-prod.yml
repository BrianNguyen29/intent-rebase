# TEMPLATE ONLY — not applied; do not claim production-ready.
global:
  smtp_smarthost: 'CHANGE_ME_SMTP_HOST:587'
  smtp_from: 'CHANGE_ME_SMTP_FROM'
  smtp_auth_username: 'CHANGE_ME_SMTP_USERNAME'
  smtp_auth_password: 'CHANGE_ME_SMTP_PASSWORD'
route:
  receiver: 'default'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
receivers:
  - name: 'default'
    slack_configs:
      - api_url: 'CHANGE_ME_SLACK_WEBHOOK_URL'
        # channel is omitted by default: Slack incoming webhooks route to their
        # configured channel and channel override can cause clientError if the
        # webhook does not allow it or the channel does not exist. Add only if
        # your webhook explicitly supports override and the channel exists.
        title: 'Intent Rebase Alert'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
    email_configs:
      - to: 'CHANGE_ME_SMTP_TO'
        send_resolved: true
