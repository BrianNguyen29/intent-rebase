apiVersion: batch/v1
kind: Job
metadata:
  name: k6-business-path-smoke
  namespace: intent-rebase
spec:
  template:
    metadata:
      labels:
        app: k6-load-test
        component: slo-validation
        run-id: "20260622-lane4-escalation"
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:0.51.0
        env:
        - name: API_BASE_URL
          value: "http://intent-api:8080"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: API_KEY
        command:
        - k6
        - run
        - /script/business-path-smoke.js
        volumeMounts:
        - name: script
          mountPath: /script
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: script
        configMap:
          name: k6-business-path-smoke-script
          # The script must be loaded into this ConfigMap before the Job runs.
          # kubectl create configmap k6-business-path-smoke-script \
          #   --from-file=infrastructure/production/k6/business-path-smoke.js \
          #   -n intent-rebase
---
# ConfigMap for the k6 script (must be created separately before applying the Job).
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-business-path-smoke-script
  namespace: intent-rebase
data:
  business-path-smoke.js: |
    // Inline fallback: if the ConfigMap is created from file, this key is
    // overwritten by the file content. This placeholder is here so the manifest
    // can be applied as a whole if the ConfigMap is patched after creation.
    // See infrastructure/production/k6/business-path-smoke.js for the real script.
    import http from 'k6/http';
    import { check, sleep } from 'k6';
    import { Counter, Rate, Trend } from 'k6/metrics';
    const targetVus = parseInt(__ENV.TARGET_VUS || '5');
    const sustainDuration = __ENV.SUSTAIN_DURATION || '5m';
    export const options = {
      stages: [
        { duration: '1m', target: targetVus },
        { duration: sustainDuration, target: targetVus },
        { duration: '1m', target: 0 },
      ],
      thresholds: {
        http_req_duration: ['p(95)<100'],
        errors: ['rate<0.001'],
      },
    };
    const errorRate = new Rate('errors');
    const latencyTrend = new Trend('latency');
    export default function () {
      const BASE_URL = __ENV.API_BASE_URL || 'http://intent-api:8080';
      const headers = { 'X-Api-Key': __ENV.API_KEY || 'test-key-not-real' };
      const r = http.get(BASE_URL + '/health', { headers });
      check(r, { 'health 200': (x) => x.status === 200 });
      errorRate.add(r.status >= 500);
      latencyTrend.add(r.timings.duration);
      sleep(1);
    }
    export function handleSummary(data) {
      return {
        stdout: JSON.stringify({
          total_requests: data.metrics.http_reqs ? data.metrics.http_reqs.count : 0,
          failed_requests: data.metrics.http_req_failed ? data.metrics.http_req_failed.count : 0,
          error_rate: data.metrics.http_req_failed ? data.metrics.http_req_failed.rate : 0,
          p95_latency_ms: data.metrics.http_req_duration ? data.metrics.http_req_duration['p(95)'] : 0,
          thresholds_passed: data.thresholds ? Object.values(data.thresholds).every(t => t.ok) : false,
          vus_max: data.metrics.vus_max ? data.metrics.vus_max.max : 0,
          duration_ms: data.state ? data.state.testRunDurationMs : 0,
        }),
      };
    }
