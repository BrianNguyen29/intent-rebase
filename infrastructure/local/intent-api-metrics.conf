# Simple nginx config to forward /metrics requests for local dev testing
# This allows Prometheus to scrape metrics without a real intent-api running
# 
# For actual intent-api metrics, run: cargo run -p intent-api
# Then Prometheus will scrape http://localhost:8080/metrics

server {
    listen 8080;
    server_name localhost;

    location /metrics {
        # Return minimal metrics for Prometheus scraping demonstration
        # In real usage, intent-api would be running and serving real metrics
        default_type text/plain;
        return 200 '# Intent API Metrics
# This is a placeholder. Run intent-api for real metrics.
# Metrics include:
# - intent_api_version_created_total
# - intent_api_rebase_preview_total
# - intent_api_rebase_apply_total
# - intent_api_audit_append_total
# - intent_api_diff_duration_seconds_bucket
# - intent_api_rebase_preview_duration_seconds_bucket
# - intent_api_rebase_apply_duration_seconds_bucket
# - intent_api_approval_wait_duration_seconds_bucket
# - intent_api_error_budget_remaining
# - intent_api_requests_total
# - intent_api_errors_total
# - compensation_action_executed_total
';
    }

    location /health {
        default_type text/plain;
        return 200 'ok';
    }

    location /ready {
        default_type text/plain;
        return 200 'ok';
    }

    location / {
        default_type text/plain;
        return 200 'Intent Rebase Engine - Metrics Endpoint\nUse /metrics for Prometheus scraping\n';
    }
}
