services:
  postgres:
    image: postgres:16-alpine
    container_name: intent-rebase-postgres
    environment:
      POSTGRES_USER: intent_rebase
      POSTGRES_PASSWORD: intent_rebase_dev
      POSTGRES_DB: intent_rebase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intent_rebase"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: intent-rebase-nats
    ports:
      - "4222:4222"   # NATS client connection
      - "8222:8222"   # HTTP monitoring
      - "6222:6222"   # Cluster port
    command: ["--js"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: intent-rebase-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  nats_data:
  minio_data:
