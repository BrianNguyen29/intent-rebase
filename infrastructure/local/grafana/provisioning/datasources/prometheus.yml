# Grafana datasources provisioning
# Batch 2 Slice 3 — Grafana provisioning (local dev only)
apiVersion: 1

datasources:
  - name: Prometheus Legacy
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 10s
