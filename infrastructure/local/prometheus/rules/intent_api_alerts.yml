# Prometheus alerting rules for Intent Rebase Engine
# Batch 2 Slice 3 — bounded alerting rules (local dev only)
# Not production-ready — requires SRE confirmation before production deployment
#
# These rules target metrics defined in 06-slo-dashboard.md
# Metrics must be instrumented in intent-api before these rules can fire.
#
# NOTE: Compensation and DLQ alert rule groups are omitted until their
# metrics are instrumented (intent_api_compensation_*, intent_api_dlq_*).

groups:
  # ============================================================
  # Availability Alerts — aligned to SLO targets from 04-sre-and-slos.md
  # ============================================================
  - name: intent_api_availability
    interval: 30s
    rules:
      # Intent version creation success rate below 99.9% SLO target
      - alert: IntentVersionCreationLowSuccessRate
        expr: |
          sum(rate(intent_api_intent_version_created_total{status="success"}[5m]))
          /
          sum(rate(intent_api_intent_version_created_total[5m])) * 100 < 99.0
        for: 5m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "Intent version creation success rate below warning threshold"
          description: "Success rate is {{ $value | printf \"%.2f\" }}% (threshold: 99.0%). SLO target is 99.9%."

      # Rebase preview availability below 99.5% SLO target
      - alert: RebasePreviewLowAvailability
        expr: |
          sum(rate(intent_api_rebase_preview_requests_total{status="success"}[5m]))
          /
          sum(rate(intent_api_rebase_preview_requests_total[5m])) * 100 < 99.0
        for: 5m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "Rebase preview availability below warning threshold"
          description: "Preview availability is {{ $value | printf \"%.2f\" }}% (threshold: 99.0%). SLO target is 99.5%."

      # Rebase apply path availability below 99.0% SLO target
      - alert: RebaseApplyLowAvailability
        expr: |
          sum(rate(intent_api_rebase_apply_requests_total{status="success"}[5m]))
          /
          sum(rate(intent_api_rebase_apply_requests_total[5m])) * 100 < 98.5
        for: 5m
        labels:
          severity: warning
          slo: availability
        annotations:
          summary: "Rebase apply path availability below critical threshold"
          description: "Apply availability is {{ $value | printf \"%.2f\" }}% (threshold: 98.5%). SLO target is 99.0%."

  # ============================================================
  # Latency Alerts — aligned to latency SLOs from 04-sre-and-slos.md
  # ============================================================
  - name: intent_api_latency
    interval: 30s
    rules:
      # Diff compute p95 latency above 2s SLO target
      - alert: DiffComputeHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(intent_api_diff_compute_duration_seconds_bucket[5m])) by (le)
          ) > 2.0
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "Diff compute p95 latency above SLO target"
          description: "p95 diff compute latency is {{ $value | printf \"%.2f\" }}s (SLO target: 2s)."

      # Rebase preview p95 latency above 10s SLO target (medium graph)
      - alert: RebasePreviewHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(intent_api_rebase_preview_duration_seconds_bucket{graph_size="medium"}[5m])) by (le)
          ) > 10.0
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "Rebase preview p95 latency above SLO target"
          description: "p95 preview latency (medium graph) is {{ $value | printf \"%.2f\" }}s (SLO target: 10s)."

      # Rebase apply p95 latency above 60s SLO target (low/medium risk)
      - alert: RebaseApplyHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(intent_api_rebase_apply_duration_seconds_bucket{risk_class=~"low|medium"}[5m])) by (le)
          ) > 60.0
        for: 5m
        labels:
          severity: warning
          slo: latency
        annotations:
          summary: "Rebase apply p95 latency above SLO target"
          description: "p95 apply latency (low/medium risk) is {{ $value | printf \"%.2f\" }}s (SLO target: 60s)."

  # ============================================================
  # Error Budget Alerts — multi-window burn-rate based (local dev)
  # Truthful scope: local dev alerting only; production rollout requires SRE confirmation
  # Windows: 1h (fast detection), 6h (sustained), 3d (chronic)
  # Thresholds chosen to detect genuine budget departure above monthly rate
  # ============================================================
  - name: intent_api_error_budget
    interval: 60s
    rules:
      # ---- 1h windows (fast burn — existing, replaced threshold with cleaner formulation) ----
      # Preview path 1h window burning > 0.5% error rate (sustained = exhausts monthly budget in ~12h)
      - alert: PreviewPathBurnRate1h
        expr: |
          sum(rate(intent_api_rebase_preview_requests_total{status!="success"}[1h]))
          /
          sum(rate(intent_api_rebase_preview_requests_total[1h])) > 0.005
        for: 10m
        labels:
          severity: warning
          budget: preview
          window: "1h"
        annotations:
          summary: "Preview path 1h burn rate elevated"
          description: "Preview 1h error rate is {{ $value | printf \"%.3f\" }}% (threshold: 0.5%). At this rate monthly budget depletes in ~12h."

      # Apply path 1h window burning > 1.0% error rate
      - alert: ApplyPathBurnRate1h
        expr: |
          sum(rate(intent_api_rebase_apply_requests_total{status!="success"}[1h]))
          /
          sum(rate(intent_api_rebase_apply_requests_total[1h])) > 0.01
        for: 10m
        labels:
          severity: warning
          budget: apply
          window: "1h"
        annotations:
          summary: "Apply path 1h burn rate elevated"
          description: "Apply 1h error rate is {{ $value | printf \"%.3f\" }}% (threshold: 1.0%). At this rate monthly budget depletes in ~12h."

      # ---- 6h windows (sustained burn — new) ----
      # Preview path 6h window burning > 0.6% (catches sustained elevation above monthly rate)
      - alert: PreviewPathBurnRate6h
        expr: |
          sum(rate(intent_api_rebase_preview_requests_total{status!="success"}[6h]))
          /
          sum(rate(intent_api_rebase_preview_requests_total[6h])) > 0.006
        for: 30m
        labels:
          severity: warning
          budget: preview
          window: "6h"
        annotations:
          summary: "Preview path 6h burn rate elevated — sustained error elevation"
          description: "Preview 6h error rate is {{ $value | printf \"%.3f\" }}% (threshold: 0.6%). Sustained elevation may indicate systemic issue."

      # Apply path 6h window burning > 1.2%
      - alert: ApplyPathBurnRate6h
        expr: |
          sum(rate(intent_api_rebase_apply_requests_total{status!="success"}[6h]))
          /
          sum(rate(intent_api_rebase_apply_requests_total[6h])) > 0.012
        for: 30m
        labels:
          severity: warning
          budget: apply
          window: "6h"
        annotations:
          summary: "Apply path 6h burn rate elevated — sustained error elevation"
          description: "Apply 6h error rate is {{ $value | printf \"%.3f\" }}% (threshold: 1.2%). Sustained elevation may indicate systemic issue."

      # ---- 3d windows (chronic burn — new) ----
      # Preview path 3d window burning > 0.8% (catches chronic degraded quality)
      - alert: PreviewPathBurnRate3d
        expr: |
          sum(rate(intent_api_rebase_preview_requests_total{status!="success"}[3d]))
          /
          sum(rate(intent_api_rebase_preview_requests_total[3d])) > 0.008
        for: 2h
        labels:
          severity: warning
          budget: preview
          window: "3d"
        annotations:
          summary: "Preview path 3d burn rate elevated — chronic degradation"
          description: "Preview 3d error rate is {{ $value | printf \"%.3f\" }}% (threshold: 0.8%). Chronic elevation indicates sustained quality degradation."

      # Apply path 3d window burning > 1.6%
      - alert: ApplyPathBurnRate3d
        expr: |
          sum(rate(intent_api_rebase_apply_requests_total{status!="success"}[3d]))
          /
          sum(rate(intent_api_rebase_apply_requests_total[3d])) > 0.016
        for: 2h
        labels:
          severity: warning
          budget: apply
          window: "3d"
        annotations:
          summary: "Apply path 3d burn rate elevated — chronic degradation"
          description: "Apply 3d error rate is {{ $value | printf \"%.3f\" }}% (threshold: 1.6%). Chronic elevation indicates sustained quality degradation."

  # ============================================================
  # Propagation Signal Alerts — Slice 2 bounded observability (local dev only)
  # Truthful scope: metrics instrumented, rule is local dev scaffolding.
  # Production deployment requires SRE confirmation and receiver config.
  # Webhook delivery and event streaming remain Phase 4+ deferred.
  # ============================================================
  - name: intent_api_propagation_signals
    interval: 30s
    rules:
      # Propagation signal failure ratio above 10% with meaningful traffic.
      # The "attempted > 0.001" guard prevents division-by-zero and noise
      # when no apply operations are occurring.
      - alert: PropagationSignalFailureRate
        expr: |
          (
            sum(rate(intent_api_propagation_signals_failed_total[5m]))
            /
            sum(rate(intent_api_propagation_signals_attempted_total[5m]))
          ) > 0.10
          and
          sum(rate(intent_api_propagation_signals_attempted_total[5m])) > 0.001
        for: 5m
        labels:
          severity: warning
          slo: propagation
        annotations:
          summary: "Propagation signal failure rate elevated (local dev rule)"
          description: "Propagation signal failure rate is {{ $value | printf \"%.2f\" }}% (threshold: 10%). See RB12 for diagnosis and manual re-signal workflow."
          runbook_url: "docs/09-operations/05-runbooks.md#RB12-Propagation-Signal-Creation-Failures"
          scope: "local-dev-only — production alerting requires SRE sign-off and receiver configuration"

  # ============================================================
  # Webhook Delivery Alerts — Slice 3 bounded observability (local dev only)
  # Truthful scope: metrics instrumented, rule is local dev scaffolding.
  # Production deployment requires SRE confirmation and receiver config.
  # No production delivery guarantees, outbox, event streaming, HMAC, or CRUD.
  # ============================================================
  - name: intent_api_webhook_delivery
    interval: 30s
    rules:
      # Webhook delivery failure ratio above 10% with meaningful traffic.
      # The "attempted > 0.001" guard prevents division-by-zero and noise
      # when no webhook deliveries are occurring.
      - alert: WebhookDeliveryFailureRate
        expr: |
          (
            sum(rate(intent_api_webhook_deliveries_failed_total[5m]))
            /
            sum(rate(intent_api_webhook_deliveries_attempted_total[5m]))
          ) > 0.10
          and
          sum(rate(intent_api_webhook_deliveries_attempted_total[5m])) > 0.001
        for: 5m
        labels:
          severity: warning
          slo: webhook_delivery
        annotations:
          summary: "Webhook delivery failure rate elevated (local dev rule)"
          description: "Webhook delivery failure rate is {{ $value | printf \"%.2f\" }}% (threshold: 10%). See RB13 for diagnosis and rollback boundaries."
          runbook_url: "docs/09-operations/05-runbooks.md#RB13-Webhook-Delivery-Failures"
          scope: "local-dev-only — production alerting requires SRE sign-off and receiver configuration"