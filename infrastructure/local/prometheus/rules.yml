# Prometheus alerting rules for Intent Rebase Engine
# Phase 3 Batch 2 - P2-S2 bounded slice
# 
# These rules cover:
# - SLO: 99.9% successful intent version creation
# - SLO: 99.5% rebase preview availability
# - SLO: 99.0% rebase apply path availability
# - SLO: 99.9% audit append success
# - Latency: p95 diff compute < 2s
# - Latency: p95 rebase preview < 10s
# - Latency: p95 rebase apply < 60s
# - Latency: p95 approval wait alert threshold: 30 minutes

groups:
  # Availability alerts - intent operations
  - name: intent_availability
    interval: 30s
    rules:
      # Critical: Intent version creation success rate < 99.5%
      - alert: IntentVersionCreationSuccessRateCritical
        expr: |
          (
            sum(rate(intent_api_version_created_total{status="success"}[5m]))
            /
            sum(rate(intent_api_version_created_total[5m]))
          ) < 0.995
        for: 5m
        labels:
          severity: critical
          slo: intent_version_creation
        annotations:
          summary: "Intent version creation success rate critically low"
          description: "Success rate is {{ $value | humanizePercentage }} (threshold: 99.5%). Check intent-api logs for errors."

      # Warning: Intent version creation success rate < 99.9%
      - alert: IntentVersionCreationSuccessRateWarning
        expr: |
          (
            sum(rate(intent_api_version_created_total{status="success"}[5m]))
            /
            sum(rate(intent_api_version_created_total[5m]))
          ) < 0.999
        for: 5m
        labels:
          severity: warning
          slo: intent_version_creation
        annotations:
          summary: "Intent version creation success rate below target"
          description: "Success rate is {{ $value | humanizePercentage }} (target: 99.9%)"

  # Rebase availability alerts
  - name: rebase_availability
    interval: 30s
    rules:
      # Critical: Rebase preview availability < 99.0%
      - alert: RebasePreviewAvailabilityCritical
        expr: |
          (
            sum(rate(intent_api_rebase_preview_total{status="success"}[5m]))
            /
            sum(rate(intent_api_rebase_preview_total[5m]))
          ) < 0.990
        for: 5m
        labels:
          severity: critical
          slo: rebase_preview_availability
        annotations:
          summary: "Rebase preview availability critically low"
          description: "Availability is {{ $value | humanizePercentage }} (threshold: 99.0%)"

      # Warning: Rebase preview availability < 99.5%
      - alert: RebasePreviewAvailabilityWarning
        expr: |
          (
            sum(rate(intent_api_rebase_preview_total{status="success"}[5m]))
            /
            sum(rate(intent_api_rebase_preview_total[5m]))
          ) < 0.995
        for: 5m
        labels:
          severity: warning
          slo: rebase_preview_availability
        annotations:
          summary: "Rebase preview availability below target"
          description: "Availability is {{ $value | humanizePercentage }} (target: 99.5%)"

      # Critical: Rebase apply availability < 98.0%
      - alert: RebaseApplyAvailabilityCritical
        expr: |
          (
            sum(rate(intent_api_rebase_apply_total{status="success"}[5m]))
            /
            sum(rate(intent_api_rebase_apply_total[5m]))
          ) < 0.980
        for: 5m
        labels:
          severity: critical
          slo: rebase_apply_availability
        annotations:
          summary: "Rebase apply availability critically low"
          description: "Availability is {{ $value | humanizePercentage }} (threshold: 98.0%)"

      # Warning: Rebase apply availability < 99.0%
      - alert: RebaseApplyAvailabilityWarning
        expr: |
          (
            sum(rate(intent_api_rebase_apply_total{status="success"}[5m]))
            /
            sum(rate(intent_api_rebase_apply_total[5m]))
          ) < 0.990
        for: 5m
        labels:
          severity: warning
          slo: rebase_apply_availability
        annotations:
          summary: "Rebase apply availability below target"
          description: "Availability is {{ $value | humanizePercentage }} (target: 99.0%)"

  # Audit availability alerts
  - name: audit_availability
    interval: 30s
    rules:
      # Critical: Audit append success rate < 99.5%
      - alert: AuditAppendSuccessRateCritical
        expr: |
          (
            sum(rate(intent_api_audit_append_total{status="success"}[5m]))
            /
            sum(rate(intent_api_audit_append_total[5m]))
          ) < 0.995
        for: 5m
        labels:
          severity: critical
          slo: audit_append
        annotations:
          summary: "Audit append success rate critically low"
          description: "Success rate is {{ $value | humanizePercentage }} (threshold: 99.5%)"

      # Warning: Audit append success rate < 99.9%
      - alert: AuditAppendSuccessRateWarning
        expr: |
          (
            sum(rate(intent_api_audit_append_total{status="success"}[5m]))
            /
            sum(rate(intent_api_audit_append_total[5m]))
          ) < 0.999
        for: 5m
        labels:
          severity: warning
          slo: audit_append
        annotations:
          summary: "Audit append success rate below target"
          description: "Success rate is {{ $value | humanizePercentage }} (target: 99.9%)"

  # Latency alerts
  - name: intent_latency
    interval: 30s
    rules:
      # Critical: Diff compute p95 > 4s (2x target)
      - alert: DiffComputeLatencyCritical
        expr: |
          histogram_quantile(0.95, 
            sum(rate(intent_api_diff_duration_seconds_bucket[5m])) by (le)
          ) > 4
        for: 5m
        labels:
          severity: critical
          slo: diff_compute_latency
        annotations:
          summary: "Diff compute p95 latency critically high"
          description: "p95 latency is {{ $value | humanizeDuration }} (threshold: 4s, target: 2s)"

      # Warning: Diff compute p95 > 2s
      - alert: DiffComputeLatencyWarning
        expr: |
          histogram_quantile(0.95, 
            sum(rate(intent_api_diff_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
          slo: diff_compute_latency
        annotations:
          summary: "Diff compute p95 latency above target"
          description: "p95 latency is {{ $value | humanizeDuration }} (target: 2s)"

      # Critical: Rebase preview p95 > 20s (2x target)
      - alert: RebasePreviewLatencyCritical
        expr: |
          histogram_quantile(0.95, 
            sum(rate(intent_api_rebase_preview_duration_seconds_bucket[5m])) by (le)
          ) > 20
        for: 5m
        labels:
          severity: critical
          slo: rebase_preview_latency
        annotations:
          summary: "Rebase preview p95 latency critically high"
          description: "p95 latency is {{ $value | humanizeDuration }} (threshold: 20s, target: 10s)"

      # Warning: Rebase preview p95 > 10s
      - alert: RebasePreviewLatencyWarning
        expr: |
          histogram_quantile(0.95, 
            sum(rate(intent_api_rebase_preview_duration_seconds_bucket[5m])) by (le)
          ) > 10
        for: 5m
        labels:
          severity: warning
          slo: rebase_preview_latency
        annotations:
          summary: "Rebase preview p95 latency above target"
          description: "p95 latency is {{ $value | humanizeDuration }} (target: 10s)"

      # Critical: Rebase apply p95 > 120s (2x target)
      - alert: RebaseApplyLatencyCritical
        expr: |
          histogram_quantile(0.95, 
            sum(rate(intent_api_rebase_apply_duration_seconds_bucket[5m])) by (le)
          ) > 120
        for: 5m
        labels:
          severity: critical
          slo: rebase_apply_latency
        annotations:
          summary: "Rebase apply p95 latency critically high"
          description: "p95 latency is {{ $value | humanizeDuration }} (threshold: 120s, target: 60s)"

      # Warning: Rebase apply p95 > 60s
      - alert: RebaseApplyLatencyWarning
        expr: |
          histogram_quantile(0.95, 
            sum(rate(intent_api_rebase_apply_duration_seconds_bucket[5m])) by (le)
          ) > 60
        for: 5m
        labels:
          severity: warning
          slo: rebase_apply_latency
        annotations:
          summary: "Rebase apply p95 latency above target"
          description: "p95 latency is {{ $value | humanizeDuration }} (target: 60s)"

  # Approval wait time alerts
  - name: approval_latency
    interval: 30s
    rules:
      # Critical: Approval wait p95 > 60 minutes (2x threshold)
      - alert: ApprovalWaitLatencyCritical
        expr: |
          histogram_quantile(0.95, 
            sum(rate(intent_api_approval_wait_duration_seconds_bucket[5m])) by (le)
          ) > 3600
        for: 10m
        labels:
          severity: critical
          slo: approval_wait_time
        annotations:
          summary: "Approval wait p95 latency critically high"
          description: "p95 wait time is {{ $value | humanizeDuration }} (threshold: 60min, alert threshold: 30min)"

      # Warning: Approval wait p95 > 30 minutes
      - alert: ApprovalWaitLatencyWarning
        expr: |
          histogram_quantile(0.95, 
            sum(rate(intent_api_approval_wait_duration_seconds_bucket[5m])) by (le)
          ) > 1800
        for: 10m
        labels:
          severity: warning
          slo: approval_wait_time
        annotations:
          summary: "Approval wait p95 latency above alert threshold"
          description: "p95 wait time is {{ $value | humanizeDuration }} (alert threshold: 30min)"

  # Error budget alerts
  - name: error_budget
    interval: 60s
    rules:
      # Error budget exhausted (>80% consumed) for any SLO
      - alert: ErrorBudgetExhausted
        expr: |
          (
            intent_api_error_budget_remaining{slo="intent_version_creation"} < 0.2
            or
            intent_api_error_budget_remaining{slo="rebase_preview_availability"} < 0.2
            or
            intent_api_error_budget_remaining{slo="rebase_apply_availability"} < 0.2
            or
            intent_api_error_budget_remaining{slo="audit_append"} < 0.2
          )
        for: 5m
        labels:
          severity: critical
          slo: error_budget
        annotations:
          summary: "Error budget nearly exhausted for {{ $labels.slo }}"
          description: "Error budget remaining is {{ $value | humanizePercentage }}. Immediate action required."

      # Error budget depleted
      - alert: ErrorBudgetDepleted
        expr: |
          (
            intent_api_error_budget_remaining{slo="intent_version_creation"} <= 0
            or
            intent_api_error_budget_remaining{slo="rebase_preview_availability"} <= 0
            or
            intent_api_error_budget_remaining{slo="rebase_apply_availability"} <= 0
            or
            intent_api_error_budget_remaining{slo="audit_append"} <= 0
          )
        for: 1m
        labels:
          severity: critical
          slo: error_budget
        annotations:
          summary: "Error budget DEPLETED for {{ $labels.slo }}"
          description: "Error budget is exhausted. SLO is at risk. Immediate incident response required."

  # Infrastructure health
  - name: infrastructure_health
    interval: 30s
    rules:
      # API server down
      - alert: IntentAPIDown
        expr: up{job="intent-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Intent API is down"
          description: "Intent API has been unreachable for 1 minute."

      # High error rate
      - alert: IntentAPIHighErrorRate
        expr: |
          sum(rate(intent_api_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(intent_api_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Intent API error rate > 5%"
          description: "Error rate is {{ $value | humanizePercentage }}"

  # Compensation service alerts (Phase 3 Batch 1)
  - name: compensation_service
    interval: 30s
    rules:
      # Critical: Compensation execution failure rate > 5%
      - alert: CompensationExecutionFailureRateCritical
        expr: |
          (
            sum(rate(compensation_action_executed_total{status="failed"}[5m]))
            /
            sum(rate(compensation_action_executed_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          slo: compensation_execution
        annotations:
          summary: "Compensation execution failure rate critically high"
          description: "Failure rate is {{ $value | humanizePercentage }} (threshold: 5%)"

      # Warning: Compensation execution failure rate > 1%
      - alert: CompensationExecutionFailureRateWarning
        expr: |
          (
            sum(rate(compensation_action_executed_total{status="failed"}[5m]))
            /
            sum(rate(compensation_action_executed_total[5m]))
          ) > 0.01
        for: 5m
        labels:
          severity: warning
          slo: compensation_execution
        annotations:
          summary: "Compensation execution failure rate elevated"
          description: "Failure rate is {{ $value | humanizePercentage }} (threshold: 1%)"
