name: CI

# Manual-only CI: no automatic runs on push or pull_request.
# All jobs require explicit workflow_dispatch trigger from the Actions tab.
# This disables GitHub Actions usage to avoid costs on this public repo.

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run cargo test (requires NATS/DB for integration tests)'
        required: false
        default: false
        type: boolean
      run_build:
        description: 'Run cargo build (heavy)'
        required: false
        default: false
        type: boolean
      run_bench:
        description: 'Run benchmarks (heavy)'
        required: false
        default: false
        type: boolean
      run_test_db:
        description: 'Run migration integration test (heavy)'
        required: false
        default: false
        type: boolean
      run_docker_build:
        description: 'Run Docker build (heavy)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Automatic lightweight jobs (run on every push/PR) ───────────────────────

  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  check:
    name: Cargo Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace

  test:
    name: Cargo Test
    runs-on: ubuntu-latest
    # Only runs when explicitly triggered with run_tests input
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  openapi-validate:
    name: OpenAPI Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate OpenAPI spec
        run: npx --yes @stoplight/spectral-cli lint docs/04-api/openapi.yaml --ruleset .spectral.yml --fail-severity=error

  # ─── Manual-only heavy jobs (require workflow_dispatch input) ───────────────

  build:
    name: Cargo Build
    runs-on: ubuntu-latest
    # Only runs when explicitly triggered with run_build input
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_build == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --release

  # Bounded benchmark slice: runs criterion benchmarks and uploads reports.
  # This verifies the benchmark harness infrastructure; actual performance targets
  # and production load testing remain gated on P2 completion (Phase 3 Batch 2).
  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    # Only runs when explicitly triggered with run_bench input
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_bench == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run benchmarks
        run: cargo bench -p rebase-engine
      - name: Upload criterion reports
        uses: actions/upload-artifact@v4
        with:
          name: criterion-reports
          path: crates/rebase-engine/target/criterion/**/report/
          retention-days: 7

  test-db:
    name: Migration Integration Test
    runs-on: ubuntu-latest
    # Only runs when explicitly triggered with run_test_db input
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_test_db == 'true'
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: intent_rebase
          POSTGRES_PASSWORD: intent_rebase_dev
          POSTGRES_DB: intent_rebase
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://intent_rebase:intent_rebase_dev@localhost:5432/intent_rebase
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Wait for postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -U intent_rebase && echo "Postgres ready" && break
            echo "Waiting for postgres... ($i)"
            sleep 1
          done
      - name: Run migration integration test
        run: cargo test -p intent-service --test migration_integration -- --ignored

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    # Only runs when explicitly triggered with run_docker_build input
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_docker_build == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: intent-api:latest
          load: true
