          description: Invalid request body (nil UUID or empty label)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Referenced IntentVersion node not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    # ----- Core Types -----
    ActorRef:
      type: object
      required: [actor_type, actor_id]
      properties:
        actor_type:
          type: string
          description: Type of actor (e.g., "user", "service", "system")
        actor_id:
          type: string
          description: Identifier of the actor

    SourceRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          description: Type of source (e.g., "spec", "ticket", "doc")
        id:
          type: string
          description: Source identifier

    ExternalRef:
      type: object
      required: [ref_type, ref_id]
      properties:
        ref_type:
          $ref: '#/components/schemas/ExternalRefType'
        ref_id:
          type: string
          format: uuid
          description: UUID of the referenced entity

    ChangeChannel:
      type: string
      enum: [user_edit, webhook, policy_update, system_normalization]
      description: How the version was created

    IntentStatus:
      type: string
      enum: [active, archived, superseded]
      description: Status of the intent document

    VersionStatus:
      type: string
      enum: [draft, active, rejected, superseded]
      description: Status of an intent version

    ClauseType:
      type: string
      enum: [functional, non_functional, policy, budget, time]

    ConstraintOperator:
      type: string
      enum: [eq, neq, lt, lte, gt, gte, contains, not_contains, regex, custom]

    ClausePriority:
      type: string
      enum: [must, should, could]

    RiskTier:
      type: string
      enum: [low, medium, high, critical]

    Urgency:
      type: string
      enum: [low, medium, high, critical]

    TradeoffDimension:
      type: string
      enum: [speed, cost, quality, risk, compatibility, latency]

    TradeoffPreference:
      type: string
      enum: [prioritize, balance, minimize, maximize]

    # ----- Payload Structure -----
    IntentObjective:
      type: object
      required: [summary, success_statement, domain]
      properties:
        summary:
          type: string
        success_statement:
          type: string
        domain:
          type: string

    IntentScope:
      type: object
      required: [in_scope, out_of_scope]
      properties:
        in_scope:
          type: array
          items:
            type: string
        out_of_scope:
          type: array
          items:
            type: string

    Constraint:
      type: object
      required: [type, key, operator, value, priority]
      properties:
        clause_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ClauseType'
        key:
          type: string
        operator:
          $ref: '#/components/schemas/ConstraintOperator'
        value: {}
        rationale:
          type: string
        priority:
          $ref: '#/components/schemas/ClausePriority'

    IntentConstraints:
      type: object
      required: [functional, non_functional, policy, budget, time]
      properties:
        functional:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
        non_functional:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
        policy:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
        budget:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
        time:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'

    AcceptanceCriterion:
      type: object
      required: [description, priority]
      properties:
        clause_id:
          type: string
          format: uuid
        description:
          type: string
        priority:
          $ref: '#/components/schemas/ClausePriority'

    AcceptanceCriteria:
      type: object
      required: [required, optional]
      properties:
        required:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'
        optional:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceCriterion'

    ActionRef:
      type: object
      required: [action]
      properties:
        action:
          type: string
        target:
          type: string

    ApprovalRuleRef:
      type: object
      required: [rule_id, description]
      properties:
        rule_id:
          type: string
        description:
          type: string

    IntentAuthority:
      type: object
      required: [allowed_actions, forbidden_actions, approval_requirements]
      properties:
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionRef'
        forbidden_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionRef'
        approval_requirements:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRuleRef'

    Tradeoff:
      type: object
      required: [dimension, preference]
      properties:
        dimension:
          $ref: '#/components/schemas/TradeoffDimension'
        preference:
          $ref: '#/components/schemas/TradeoffPreference'

    IntentPreferences:
      type: object
      required: [tradeoffs]
      properties:
        tradeoffs:
          type: array
          items:
            $ref: '#/components/schemas/Tradeoff'

    DocRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
        id:
          type: string
        uri:
          type: string

    IntentReferences:
      type: object
      required: [specs, tickets, repos, policies]
      properties:
        specs:
          type: array
          items:
            $ref: '#/components/schemas/DocRef'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/DocRef'
        repos:
          type: array
          items:
            $ref: '#/components/schemas/DocRef'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/DocRef'

    IntentAssumptions:
      type: object
      required: [explicit]
      properties:
        explicit:
          type: array
          items:
            type: string

    IntentMetadataV1:
      type: object
      required: [risk_tier, urgency, confidence]
      properties:
        risk_tier:
          $ref: '#/components/schemas/RiskTier'
        urgency:
          $ref: '#/components/schemas/Urgency'
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1

    IntentPayload:
      type: object
      required: [objective, scope, constraints, acceptance_criteria, authority, preferences, references, assumptions, metadata]
      properties:
        objective:
          $ref: '#/components/schemas/IntentObjective'
        scope:
          $ref: '#/components/schemas/IntentScope'
        constraints:
          $ref: '#/components/schemas/IntentConstraints'
        acceptance_criteria:
          $ref: '#/components/schemas/AcceptanceCriteria'
        authority:
          $ref: '#/components/schemas/IntentAuthority'
        preferences:
          $ref: '#/components/schemas/IntentPreferences'
        references:
          $ref: '#/components/schemas/IntentReferences'
        assumptions:
          $ref: '#/components/schemas/IntentAssumptions'
        metadata:
          $ref: '#/components/schemas/IntentMetadataV1'

    # ----- Document Types -----
    Intent:
      type: object
      required: [id, tenant_id, workflow_id, current_version, status, created_at, created_by, source_refs, tags]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        current_version:
          type: integer
        status:
          $ref: '#/components/schemas/IntentStatus'
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/ActorRef'
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
        tags:
          type: array
          items:
            type: string

    IntentVersion:
      type: object
      required: [id, intent_id, version_number, parent_version_id, created_at, created_by, change_reason, change_channel, status, hash, payload]
      properties:
        id:
          type: string
          format: uuid
        intent_id:
          type: string
          format: uuid
        version_number:
          type: integer
        parent_version_id:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/ActorRef'
        change_reason:
          type: string
        change_channel:
          $ref: '#/components/schemas/ChangeChannel'
        status:
          $ref: '#/components/schemas/VersionStatus'
        hash:
          type: string
          description: SHA-256 hash of payload for integrity verification
        payload:
          $ref: '#/components/schemas/IntentPayload'

    # ----- Request/Response Types -----
    CreateIntentRequest:
      type: object
      required: [workflow_id, source_refs, payload, created_by, tags]
      properties:
        workflow_id:
          type: string
          format: uuid
        source_refs:
          type: array
          items:
            $ref: '#/components/schemas/SourceRef'
        payload:
          $ref: '#/components/schemas/IntentPayload'
        created_by:
          $ref: '#/components/schemas/ActorRef'
        tags:
          type: array
          items:
            type: string

    CreateIntentResponse:
      type: object
      required: [intent_id, current_version, status]
      properties:
        intent_id:
          type: string
          format: uuid
        current_version:
          type: integer
        status:
          $ref: '#/components/schemas/IntentStatus'

    CreateVersionRequest:
      type: object
      required: [payload, change_reason, change_channel, created_by]
      properties:
        payload:
          $ref: '#/components/schemas/IntentPayload'
        change_reason:
          type: string
        change_channel:
          $ref: '#/components/schemas/ChangeChannel'
        created_by:
          $ref: '#/components/schemas/ActorRef'

    CreateVersionResponse:
      type: object
      required: [intent_version_id, intent_id, version_number, status]
      properties:
        intent_version_id:
          type: string
          format: uuid
        intent_id:
          type: string
          format: uuid
        version_number:
          type: integer
        status:
          $ref: '#/components/schemas/VersionStatus'

    IntentHeadResponse:
      type: object
      required: [intent, version, row_version]
      properties:
        intent:
          $ref: '#/components/schemas/Intent'
        version:
          $ref: '#/components/schemas/IntentVersion'
        row_version:
          type: integer
          description: |
            Row version for optimistic concurrency control (OCC).
            Clients should store this value and send back via X-Expected-Row-Version header
            when creating new versions to enable OCC detection.
            The row_version increments each time the intent is modified.

    ListVersionsResponse:
      type: object
      required: [intent_id, versions, total]
      properties:
        intent_id:
          type: string
          format: uuid
        versions:
          type: array
          items:
            $ref: '#/components/schemas/IntentVersion'
        total:
          type: integer

    DiffRequest:
      type: object
      required: [from_version, to_version]
      properties:
        from_version:
          type: integer
          description: Source version number (must be less than to_version)
        to_version:
          type: integer
          description: Target version number (must be greater than from_version)

    DiffResponse:
      type: object
      required: [intent_id, from_version, to_version, diff, risk]
      properties:
        intent_id:
          type: string
          format: uuid
        from_version:
          $ref: '#/components/schemas/IntentVersion'
        to_version:
          $ref: '#/components/schemas/IntentVersion'
        diff:
          $ref: '#/components/schemas/IntentVersionDiff'
        risk:
          $ref: '#/components/schemas/DiffRiskAnalysis'

    RebasePreviewResponse:
      type: object
      description: |
        Phase 1 PR #16: Graph-integrated rebase plan response.
        
        Exposes planner summary fields plus graph-integrated affected items when available.
        The `affected_items.status` field indicates whether graph classification succeeded:
        - `available`: Graph data was found and affected items were classified
        - `unavailable`: Graph node not found or graph service unavailable - arrays may be incomplete
        
        Phase 1 PR #17 kept apply/checkpoint typed contracts internal to the planner.
        This preview response now additionally exposes the bounded read-only
        `compensation_planning` summary, while execution contracts remain internal.

        When status is `unavailable`, the endpoint remains functional but the affected
        items arrays should not be considered authoritative.

        **Phase 2b: `risk_tier` is the canonical public risk field (Low/Medium/High/Critical).**
        `risk_level` (1-5) and `decision_class` remain as supporting fields.

        **Phase 3 Batch 1: `compensation_planning` exposes read-only compensation planning summary.**
        This is a skeleton/preview only — does not indicate execution capability or actual compensation actions.
      required: [intent_id, from_version, to_version, decision_class, rationale, section_decisions, affected_items, manual_review_recommended, risk_tier, risk_level, compensation_planning]
      properties:
        intent_id:
          type: string
          format: uuid
        from_version:
          $ref: '#/components/schemas/IntentVersion'
        to_version:
          $ref: '#/components/schemas/IntentVersion'
        decision_class:
          $ref: '#/components/schemas/DecisionClass'
        rationale:
          type: string
          description: Human-readable decision rationale
        section_decisions:
          type: array
          items:
            $ref: '#/components/schemas/SectionDecision'
        affected_items:
          $ref: '#/components/schemas/AffectedItemsPreview'
        manual_review_recommended:
          type: boolean
        risk_tier:
          $ref: '#/components/schemas/RiskTier'
          description: |
            Phase 2b: Canonical public risk tier (primary public risk field).
            Maps from DiffRiskAnalysis.severity: Low/Medium/High/Critical.
        risk_level:
          type: integer
          minimum: 1
          maximum: 5
          description: Supporting risk level (1=lowest, 5=highest)
        compensation_planning:
          $ref: '#/components/schemas/CompensationPlanningSummary'
          description: |
            Phase 3 Batch 1: Read-only compensation planning summary.
            This is planner-generated preview data, NOT executed compensation actions.
            The `ready` field indicates whether full compensation planning is available;
            when `false`, the action list is empty and execution is not supported.

    RebaseApplyResponse:
      type: object
      description: |
        Response for the bounded external rebase-apply path.

        D/E outcomes are surfaced as `blocked_manual_review` with HTTP 202.
        Runtime replay status reflects cooperative runtime signaling, not native Temporal reset.

        **Phase 2b: `risk_tier` is the canonical public risk field (Low/Medium/High/Critical).**
        `risk_level` (1-5) and `decision_class` remain as supporting fields.

        **Phase 3 Batch 1: `compensation_planning` exposes read-only compensation planning summary.**
        This is a skeleton/preview only — does not indicate execution capability or actual compensation actions.
      required:
        - intent_id
        - from_version
        - to_version
        - decision_class
        - risk_tier
        - risk_level
        - outcome
        - manual_review_required
        - notification_required
        - rationale
        - runtime_execution_status
        - signal_sent
        - replay_attempted
        - replay_completed
        - graph_updates_applied
        - graph_updates_failed
        - compensation_planning
      properties:
        intent_id:
          type: string
          format: uuid
        from_version:
          $ref: '#/components/schemas/IntentVersion'
        to_version:
          $ref: '#/components/schemas/IntentVersion'
        decision_class:
          $ref: '#/components/schemas/DecisionClass'
        risk_tier:
          $ref: '#/components/schemas/RiskTier'
          description: |
            Phase 2b: Canonical public risk tier (primary public risk field).
            Maps from DiffRiskAnalysis.severity: Low/Medium/High/Critical.
        risk_level:
          type: integer
          minimum: 1
          maximum: 5
          description: Supporting risk level (1=lowest, 5=highest)
        outcome:
          type: string
          enum:
            - no_op
            - auto_proceeded
            - auto_proceeded_with_notification
            - blocked_manual_review
        manual_review_required:
          type: boolean
        notification_required:
          type: boolean
        rationale:
          type: string
        aligned_checkpoint_id:
          type: string
          format: uuid
          nullable: true
        checkpoint_alignment_outcome:
          type: string
          nullable: true
          enum:
            - aligned
            - closest_match
            - no_checkpoint_required
            - no_checkpoint_found
            - multiple_candidates
        runtime_execution_status:
          type: string
          enum:
            - not_applicable
            - skipped_not_ready
            - degraded
            - succeeded
            - succeeded_no_replay
        signal_sent:
          type: boolean
        replay_attempted:
          type: boolean
        replay_completed:
          type: boolean
        graph_updates_applied:
          type: integer
          minimum: 0
        graph_updates_failed:
          type: integer
          minimum: 0
        compensation_planning:
          $ref: '#/components/schemas/CompensationPlanningSummary'
          description: |
            Phase 3 Batch 1: Read-only compensation planning summary.
            This is planner-generated preview data, NOT executed compensation actions.
            The `ready` field indicates whether full compensation planning is available;
            when `false`, the action list is empty and execution is not supported.

    ReplayRequest:
      type: object
      description: |
        Phase 2b bounded replay slice request.
        
        Bounded checkpoint selection strategy:
        - If `checkpoint_id` is provided, use that specific checkpoint
        - Otherwise, use the most recent active checkpoint for the workflow
        
        Note: This is cooperative signal-based replay, NOT native Temporal reset.
      required: [to_version]
      properties:
        from_version:
          type: integer
          nullable: true
          description: Source version for replay (optional, uses current head if not specified)
        to_version:
          type: integer
          description: Target version for replay
        checkpoint_id:
          type: string
          format: uuid
          nullable: true
          description: Optional specific checkpoint ID to use for replay

    ReplayResponse:
      type: object
      description: |
        Phase 2b bounded replay slice response.
        
        Reflects cooperative signal-based replay semantics using existing
        runtime/checkpoint seams. This is NOT native Temporal reset.
      required:
        - intent_id
        - from_version
        - to_version
        - checkpoint_selection_outcome
        - runtime_execution_status
        - signal_sent
        - replay_attempted
        - replay_completed
      properties:
        intent_id:
          type: string
          format: uuid
        from_version:
          type: integer
        to_version:
          type: integer
        aligned_checkpoint_id:
          type: string
          format: uuid
          nullable: true
          description: Checkpoint ID used for replay (if any)
        checkpoint_selection_outcome:
          type: string
          description: Checkpoint selection outcome label
        runtime_execution_status:
          type: string
          enum:
            - not_applicable
            - skipped_not_ready
            - degraded
            - succeeded
            - succeeded_no_replay
        signal_sent:
          type: boolean
        replay_attempted:
          type: boolean
        replay_completed:
          type: boolean

    AffectedItemsPreview:
      type: object
      description: |
        Graph-integrated affected items preview (Phase 1 PR #16).
        
        Contains classified affected items from the dependency graph when available.
        The `status` field indicates data availability:
        - `available`: Graph classification succeeded
        - `unavailable`: Graph node not found or graph service unavailable
        
        Note: Compensation action generation is a Phase 2 feature (see `deferred.compensation`).
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AffectedItemsStatus'
        affected_artifacts:
          type: array
          description: Artifacts that depend on this IntentVersion
          items:
            $ref: '#/components/schemas/AffectedItem'
        affected_approvals:
          type: array
          description: Approvals associated with this IntentVersion
          items:
            $ref: '#/components/schemas/AffectedItem'
        side_effects:
          type: array
          description: Side effects downstream from this IntentVersion (may need compensation review)
          items:
            $ref: '#/components/schemas/AffectedItem'

    AffectedItemsStatus:
      type: string
      enum: [available, unavailable]
      description: |
        Status of graph-integrated affected items classification:
        - `available`: Graph data was found and classification succeeded
        - `unavailable`: Graph node not found or graph service not available

    AffectedItem:
      type: object
      description: A single affected item with classification details
      required: [node_id, label, impact, reason]
      properties:
        node_id:
          type: string
          format: uuid
          description: The graph node ID of the affected item
        label:
          type: string
          description: Human-readable label from the graph node
        impact:
          $ref: '#/components/schemas/ClassificationImpact'
        reason:
          type: string
          description: Human-readable reason for the classification
        external_ref:
          $ref: '#/components/schemas/ExternalRef'
          description: External reference type if available

    ClassificationImpact:
      type: string
      enum: [direct, transitive, unchanged]
      description: |
        Impact classification level:
        - `direct`: Node is directly affected by the change (1 hop)
        - `transitive`: Node is affected through a chain of dependencies (2+ hops)
        - `unchanged`: Node exists in graph but is not affected

    DecisionClass:
      type: string
      enum: [A, B, C, D, E]
      description: |
        Decision class for rebase planning:
        - A: No-op / Metadata update — no execution semantics affected
        - B: Soft review — no immediate invalidation but review recommended
        - C: Partial repair — local invalidation, selective checkpoint resume
        - D: Compensation + repair — side effects need mitigation
        - E: Hard restart / manual handoff — auto-repair not safe

    SectionDecision:
      type: object
      properties:
        section:
          type: string
          description: Section name (scope, constraints, acceptance_criteria, authority)
        change_summary:
          type: string
          description: Human-readable change summary for this section
        recommended_action:
          type: string
          description: Recommended action for this section

    # ----- Compensation Planning (Phase 3 Batch 1) -----
    CompensationPlanningSummary:
      type: object
      description: |
        Phase 3 Batch 1: Public compensation planning summary for API responses.

        This is a read-only summary of compensation planning output from the rebase planner.
        It exposes the skeleton/preview compensation data without claiming execution support.

        **Distinction from actual compensation actions:**
        - This summary represents planner-generated potential compensation actions
          derived from affected items analysis during rebase preview
        - Actual compensation actions (stored records) are queried via
          `GET /intents/{intent_id}/compensation-actions` using CompensationActionService

        **Execution readiness:**
        - `ready: true` indicates full compensation planning is available
        - `ready: false` (Phase 3 Batch 1) indicates compensation planning is deferred;
          the action list will be empty and execution is not supported
      required: [ready, potential_actions, has_irreversible_effects]
      properties:
        ready:
          type: boolean
          description: |
            Whether full compensation planning is ready to execute.
            When false (Phase 3 Batch 1), compensation planning is deferred and
            the potential_actions list will be empty.
        potential_actions:
          type: array
          description: |
            Phase 3 Batch 1: This is a skeleton/preview list; actual execution
            requires Batch 1+ planner implementation.
          items:
            $ref: '#/components/schemas/CompensationAction'
        has_irreversible_effects:
          type: boolean
          description: |
            Whether any irreversible side effects are present in the affected items.
            When true, manual intervention may be required even for automatic compensation.
        rationale:
          type: string
          nullable: true
          description: Human-readable rationale for compensation planning decisions.

    CompensationAction:
      type: object
      description: |
        A potential compensation action to mitigate side effects.
        This is the lightweight planning summary version used in compensation_planning.
      required: [id, label, description, reversible, priority]
      properties:
        id:
          type: string
          description: Action identifier
        label:
          type: string
          description: Human-readable label
        description:
          type: string
          description: Description of the action
        reversible:
          type: boolean
          description: Whether this action is reversible
        priority:
          type: integer
          format: int32
          minimum: 0
          description: Priority (lower = higher priority)

    IntentVersionDiff:
      type: object
      description: Structured diff for intent version changes
      properties:
        scope:
          $ref: '#/components/schemas/ScopeDiff'
        constraints:
          $ref: '#/components/schemas/ConstraintsDiff'
        acceptance_criteria:
          $ref: '#/components/schemas/AcceptanceCriteriaDiff'
        authority:
          $ref: '#/components/schemas/AuthorityDiff'

    ScopeDiff:
      type: object
      properties:
        in_scope:
          $ref: '#/components/schemas/ScopeItemsDiff'
        out_of_scope:
          $ref: '#/components/schemas/ScopeItemsDiff'

    ScopeItemsDiff:
      type: object
      properties:
        added:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string

    ConstraintsDiff:
      type: object
      properties:
        functional:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintDiff'
        non_functional:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintDiff'
        policy:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintDiff'
        budget:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintDiff'
        time:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintDiff'

    ConstraintDiff:
      type: object
      properties:
        clause_id:
          type: string
          format: uuid
          nullable: true
        change_type:
          type: string
          enum: [added, removed, modified]
        constraint_type:
          type: string
          enum: [functional, non_functional, policy, budget, time]
        key:
          type: string
        before:
          $ref: '#/components/schemas/Constraint'
          nullable: true
        after:
          $ref: '#/components/schemas/Constraint'
          nullable: true

    AcceptanceCriteriaDiff:
      type: object
      properties:
        required:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceCriterionDiff'
        optional:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceCriterionDiff'

    AcceptanceCriterionDiff:
      type: object
      properties:
        clause_id:
          type: string
          format: uuid
          nullable: true
        change_type:
          type: string
          enum: [added, removed, modified]
        priority:
          type: string
        before:
          $ref: '#/components/schemas/AcceptanceCriterion'
          nullable: true
        after:
          $ref: '#/components/schemas/AcceptanceCriterion'
          nullable: true

    AuthorityDiff:
      type: object
      properties:
        allowed_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionRefDiff'
        forbidden_actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionRefDiff'
        approval_requirements:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRuleDiff'

    ActionRefDiff:
      type: object
      properties:
        change_type:
          type: string
          enum: [added, removed, modified]
        action:
          type: string
        target:
          type: string
          nullable: true
        before:
          $ref: '#/components/schemas/ActionRef'
          nullable: true
        after:
          $ref: '#/components/schemas/ActionRef'
          nullable: true

    ApprovalRuleDiff:
      type: object
      properties:
        change_type:
          type: string
          enum: [added, removed, modified]
        rule_id:
          type: string
        description:
          type: string
        before:
          $ref: '#/components/schemas/ApprovalRuleRef'
          nullable: true
        after:
          $ref: '#/components/schemas/ApprovalRuleRef'
          nullable: true

    DiffRiskAnalysis:
      type: object
      properties:
        severity:
          type: string
          enum: [low, medium, high, critical]
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        manual_review:
          type: boolean
        manual_review_reasons:
          description: |
            Reasons why manual review is recommended. Each reason is either a simple string
            (for unit variants like "critical_severity") or a structured object for variants
            with data (e.g., {"low_confidence": {"confidence": 0.5, "threshold": 0.7}}).
          type: array
          items:
            oneOf:
              - type: string
                description: Unit variant reasons (e.g., "critical_severity", "high_severity_authority_change", "policy_constraint_changed", "approval_requirement_removed")
              - type: object
                description: Structured variant reasons
                additionalProperties: true
                example:
                  low_confidence:
                    confidence: 0.5
                    threshold: 0.7
        section_risks:
          type: array
          items:
            $ref: '#/components/schemas/SectionRisk'
        rationale:
          type: string
          nullable: true

    SectionRisk:
      type: object
      properties:
        section:
          type: string
        severity:
          type: string
          enum: [low, medium, high, critical]
        change_count:
          type: integer
        high_priority_changes:
          type: integer

    # ----- Health & Observability -----
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
        version:
          type: string
          description: Service version

    ReadyResponse:
      type: object
      required: [status, ready]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        ready:
          type: boolean
        checks:
          type: array
          description: Individual readiness checks
          items:
            type: object
            properties:
              name:
                type: string
              ready:
                type: boolean
              error:
                type: string
                nullable: true

    # ----- Intent Validation -----
    ValidateIntentRequest:
      type: object
      required: [payload]
      properties:
        payload:
          $ref: '#/components/schemas/IntentPayload'

    ValidateIntentResponse:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationWarning'

    ValidationError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Dot-notation path to the invalid field
        message:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code

    ValidationWarning:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Dot-notation path to the field with a warning
        message:
          type: string
          description: Human-readable warning message
        code:
          type: string
          description: Machine-readable warning code

    # ----- Graph Types -----
    NodeType:
      type: string
      enum: [Intent, IntentVersion, Artifact, Approval, PolicySnapshot, SideEffect, Checkpoint, Workflow, Generic]
      description: Type of a graph node

    NodeState:
      type: string
      enum: [Active, Stale, Invalid, Archived]
      description: State of a graph node

    EdgeType:
      type: string
      enum: [DependsOn, Produces, Approves, Triggers, Defines, GeneratedFrom, ValidatedBy, GovernedBy, DerivedFrom, StoredIn, Supersedes, Blocks, Compensates]
      description: Type label for a graph edge

    ExternalRefType:
      type: string
      enum: [Intent, IntentVersion, Artifact, Approval, PolicySnapshot, SideEffect, Checkpoint]
      description: Type of external reference

    GraphNode:
      type: object
      required: [id, tenant_id, workflow_id, node_type, label, state, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        node_type:
          $ref: '#/components/schemas/NodeType'
        external_ref:
          $ref: '#/components/schemas/ExternalRef'
          nullable: true
        label:
          type: string
        state:
          $ref: '#/components/schemas/NodeState'
        properties:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    GraphEdge:
      type: object
      required: [id, tenant_id, workflow_id, from_node_id, to_node_id, edge_type, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        from_node_id:
          type: string
          format: uuid
        to_node_id:
          type: string
          format: uuid
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        properties:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time

    CreateGraphNodeRequest:
      type: object
      required: [tenant_id, workflow_id, node_type, label]
      properties:
        tenant_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        node_type:
          $ref: '#/components/schemas/NodeType'
        external_ref:
          $ref: '#/components/schemas/ExternalRef'
          nullable: true
        label:
          type: string
        properties:
          type: object
          additionalProperties: true
          nullable: true

    CreateGraphEdgeRequest:
      type: object
      required: [tenant_id, workflow_id, from_node_id, to_node_id, edge_type]
      properties:
        tenant_id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        from_node_id:
          type: string
          format: uuid
        to_node_id:
          type: string
          format: uuid
        edge_type:
          $ref: '#/components/schemas/EdgeType'
        properties:
          type: object
          additionalProperties: true
          nullable: true

    ListGraphNodesResponse:
      type: object
      required: [nodes, total]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        total:
          type: integer

    ListGraphEdgesResponse:
      type: object
      required: [edges, total]
      properties:
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        total:
          type: integer

    ListEdgesFromNodeResponse:
      type: object
      required: [node_id, edges]
      properties:
        node_id:
          type: string
          format: uuid
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'

    # ----- Artifact Ingest (Phase 3 Batch 1 groundwork) -----
    SideEffectClass:
      type: string
      enum: [s0_pure_read, s1_internal_reversible, s2_external_reversible, s3_external_partially_reversible, s4_irreversible]
      description: |
        Side effect severity class for capture context.
        - s0_pure_read: Pure read, no side effect
        - s1_internal_reversible: Internal reversible
        - s2_external_reversible: External reversible (default)
        - s3_external_partially_reversible: External partially reversible
        - s4_irreversible: Irreversible

    SideEffectCaptureContext:
      type: object
      description: |
        Phase 3 Batch 1 (groundwork): Context for optional side effect capture.
        When an artifact-producing operation has proper intent/version context,
        this struct carries the information needed to record a side effect.

        **Validation rules** (when side_effect_context is provided):
        - source_intent_id: required, cannot be nil UUID
        - source_intent_version: required, must be > 0
        - effect_type: required, cannot be empty or whitespace-only
        - target: required, cannot be empty or whitespace-only
        - effect_class: optional, defaults to s2_external_reversible
        - idempotency_key: optional, but if provided cannot be empty or whitespace-only
      properties:
        source_intent_id:
          type: string
          format: uuid
          description: The intent ID that produced this artifact (cannot be nil)
        source_intent_version:
          type: integer
          description: The intent version at time of artifact production (must be > 0)
        effect_type:
          type: string
          description: The effect type (e.g., "artifact_created", "deployment_triggered"). Cannot be empty or whitespace-only.
        target:
          type: string
          description: The effect target (e.g., artifact URL, deployment ID). Cannot be empty or whitespace-only.
        effect_class:
          $ref: '#/components/schemas/SideEffectClass'
          description: The side effect severity class. Defaults to s2_external_reversible if not specified.
        idempotency_key:
          type: string
          nullable: true
          description: Optional idempotency key to prevent duplicate side effect records

    ArtifactIngestRequest:
      type: object
      required: [tenant_id, workflow_id, external_ref, label]
      description: |
        Phase 3 Batch 1 (groundwork): Request to ingest an artifact with optional side effect capture.
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Tenant scope (cannot be nil UUID)
        workflow_id:
          type: string
          format: uuid
          description: Workflow scope (cannot be nil UUID)
        external_ref:
          $ref: '#/components/schemas/ExternalRef'
          description: External reference to the artifact (ref_id cannot be nil UUID)
        label:
          type: string
          description: Human-readable label for the artifact (cannot be empty or whitespace-only)
        depends_on_intent_versions:
          type: array
          items:
            type: string
            format: uuid
          description: IntentVersion node IDs this artifact depends on
        properties:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional properties to attach to the artifact node
        side_effect_context:
          $ref: '#/components/schemas/SideEffectCaptureContext'
          nullable: true
          description: |
            Phase 3 Batch 1 (groundwork): Optional context for side effect capture.
            When provided with sufficient fields, enables capture-on-write to the
            compensation ledger after successful artifact ingest.

    ArtifactIngestResponse:
      type: object
      description: |
        Phase 3 Batch 1 (groundwork): Response for artifact ingest with side effect capture result.
      required: [node, edges, side_effect_recorded]
      properties:
        node:
          $ref: '#/components/schemas/GraphNode'
          description: The created Artifact graph node
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
          description: The created DependsOn edges to IntentVersion nodes
        side_effect_recorded:
          type: boolean
          description: Phase 3 Batch 1 (groundwork): Indicates whether a side effect was recorded
        side_effect_id:
          type: string
          format: uuid
          nullable: true
          description: The ID of the recorded side effect (if side_effect_recorded is true)

    ListPendingApprovalRequestsResponse:
      type: object
      required: [approval_requests, total]
      properties:
        approval_requests:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalRequestSummary'
        total:
          type: integer

    ApprovalRequestSummary:
      type: object
      required: [id, intent_id, intent_version_from, intent_version_to, decision_class, reason, requestor_id, requestor_type, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        intent_id:
          type: string
          format: uuid
        intent_version_from:
          type: integer
        intent_version_to:
          type: integer
        decision_class:
          type: string
        reason:
          type: string
        requestor_id:
          type: string
        requestor_type:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true

    ApproveApprovalRequestBody:
      type: object
      properties:
        resolution_notes:
          type: string
          nullable: true
          description: Optional notes from the approver

    RejectApprovalRequestBody:
      type: object
      properties:
        resolution_notes:
          type: string
          nullable: true
          description: Optional notes from the rejector

    ApprovalRequestResponse:
      type: object
      required: [id, intent_id, status, resolved_by]
      properties:
        id:
          type: string
          format: uuid
        intent_id:
          type: string
          format: uuid
        status:
          type: string
        resolved_by:
          type: string
        resolved_at:
          type: string
          format: date-time
          nullable: true
          resolution_notes:
            type: string
            nullable: true

    # ----- Orchestration Dashboard (Phase 3 Batch 1) -----
    CompensationActionStatusCounts:
      type: object
      description: |
        Phase 3 Batch 1: Summary counts for compensation actions by status.
      properties:
        pending:
          type: integer
          description: Count of pending compensation actions
        approved:
          type: integer
          description: Count of approved compensation actions
        executed:
          type: integer
          description: Count of executed compensation actions
        failed:
          type: integer
          description: Count of failed compensation actions
        waived:
          type: integer
          description: Count of waived compensation actions

    SideEffectSummary:
      type: object
      description: |
        Phase 3 Batch 1: Summary of side effects for an intent.
      properties:
        total:
          type: integer
          description: Total count of side effects
        irreversible_count:
          type: integer
          description: Count of S4Irreversible side effects
        auto_compensatable_count:
          type: integer
          description: Count of S0/S1 side effects (auto-compensatable)

    CompensationActionSummary:
      type: object
      description: |
        Phase 3 Batch 1: Summary of compensation actions for an intent.
      properties:
        total:
          type: integer
          description: Total count of compensation actions
        status_counts:
          $ref: '#/components/schemas/CompensationActionStatusCounts'
        retryable_failed_count:
          type: integer
          description: Count of Failed actions with retryable errors
        dlq_candidate_count:
          type: integer
          description: Count of DLQ candidates (Failed + exhausted OR non-retryable)
        reapprovable_count:
          type: integer
          description: Count of Failed + retryable error + remaining budget
        auto_executable_count:
          type: integer
          description: Count of Approved + Automatic feasibility

    OrchestrationDashboardResponse:
      type: object
      description: |
        Phase 3 Batch 1 (bounded read-only slice): Response for the intent orchestration
        dashboard endpoint. Returns a consolidated view of side effects and compensation
        actions for a single intent within a tenant.

        **This endpoint is READ-ONLY** - does not trigger any mutations.
        **Truthful summaries** - all counts derived from persisted data.
      required: [intent_id, tenant_id, side_effects, side_effect_summary, compensation_actions, compensation_action_summary]
      properties:
        intent_id:
          type: string
          format: uuid
          description: Intent ID
        tenant_id:
          type: string
          format: uuid
          description: Tenant ID
        side_effects:
          type: array
          items:
            $ref: '#/components/schemas/SideEffect'
          description: Raw list of side effects for this intent
        side_effect_summary:
          $ref: '#/components/schemas/SideEffectSummary'
        compensation_actions:
          type: array
          items:
            $ref: '#/components/schemas/FullCompensationAction'
          description: Raw list of compensation actions for this intent
        compensation_action_summary:
          $ref: '#/components/schemas/CompensationActionSummary'

    # ----- Side Effect and Compensation Action Query (Phase 3 Batch 1) -----
    SideEffect:
      type: object
      description: |
        Phase 3 Batch 1: A side effect recorded from an artifact-producing operation.
        Used as input to compensation planning.
      required: [id, tenant_id, intent_id, intent_version, effect_class, effect_type, target, occurred_at]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this side effect
        tenant_id:
          type: string
          format: uuid
          description: Tenant this side effect belongs to
        intent_id:
          type: string
          format: uuid
          description: Intent ID that produced this side effect
        intent_version:
          type: integer
          description: Intent version at time of side effect
        effect_class:
          $ref: '#/components/schemas/SideEffectClass'
          description: Severity class of the side effect
        effect_type:
          type: string
          description: The effect type (e.g., "artifact_created", "deployment_triggered")
        target:
          type: string
          description: The effect target (e.g., artifact URL, deployment ID)
        occurred_at:
          type: string
          format: date-time
          description: When the side effect occurred
        idempotency_key:
          type: string
          nullable: true
          description: Optional idempotency key to prevent duplicate records

    ListSideEffectsResponse:
      type: object
      required: [side_effects, total]
      properties:
        side_effects:
          type: array
          items:
            $ref: '#/components/schemas/SideEffect'
        total:
          type: integer

    CompensationStatus:
      type: string
      enum: [pending, approved, executed, failed, waived]
      description: Status of a compensation action

    CompensationFeasibility:
      type: string
      enum: [automatic, semi_automatic, manual_only, not_possible]
      description: Feasibility level for compensation

    StrategyType:
      type: string
      enum: [rollback, counter_action, followup_notice, quarantine, escalation]
      description: Compensation strategy type

    RebaseContext:
      type: object
      description: Minimal rebase context that triggered compensation planning
      required: [intent_id, from_version, to_version, workflow_id]
      properties:
        intent_id:
          type: string
          format: uuid
          description: Intent ID that was rebased
        from_version:
          type: integer
          description: Source intent version before rebase
        to_version:
          type: integer
          description: Target intent version after rebase
        workflow_id:
          type: string
          format: uuid
          description: Workflow that initiated the rebase

    ExecutionResult:
      type: object
      description: Execution result payload for a compensation action
      required: [success, summary, completed_at]
      properties:
        success:
          type: boolean
          description: Whether execution succeeded
        summary:
          type: string
          description: Human-readable summary of what happened
        error_code:
          type: string
          nullable: true
          description: Error code if execution failed
        error_detail:
          type: string
          nullable: true
          description: Error detail if execution failed
        completed_at:
          type: string
          format: date-time
          description: Timestamp when execution completed

    FullCompensationAction:
      type: object
      description: |
        Full compensation action record from the compensation action repository.
        This is the stored record returned by GET /intents/{intent_id}/compensation-actions.
      required: [id, tenant_id, side_effect_id, intent_id, trigger_context, feasibility, strategy_type, rationale, status, attempt_count, lock_version, generated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this compensation action
        tenant_id:
          type: string
          format: uuid
          description: Tenant this compensation action belongs to
        side_effect_id:
          type: string
          format: uuid
          description: Reference to the side effect this action compensates
        intent_id:
          type: string
          format: uuid
          description: Reference to the intent this compensation action is scoped to
        trigger_context:
          $ref: '#/components/schemas/RebaseContext'
          description: Minimal rebase context that triggered compensation planning
        execution_result_payload:
          $ref: '#/components/schemas/ExecutionResult'
          nullable: true
          description: Execution result context captured after executor runs
        feasibility:
          $ref: '#/components/schemas/CompensationFeasibility'
          description: Feasibility of compensating this effect
        strategy_type:
          $ref: '#/components/schemas/StrategyType'
          description: Chosen compensation strategy
        rationale:
          type: string
          description: Human-readable rationale for the chosen strategy
        status:
          $ref: '#/components/schemas/CompensationStatus'
          description: Current status of the compensation action
        attempt_count:
          type: integer
          description: Execution attempt counter for idempotency/retry tracking
        lock_version:
          type: integer
          description: Lock version for optimistic concurrency during status transitions
        generated_at:
          type: string
          format: date-time
          description: When this action was generated
        approved_at:
          type: string
          format: date-time
          nullable: true
          description: When compensation was approved
        approved_by:
          type: string
          nullable: true
          description: Who approved this compensation action
        waived_at:
          type: string
          format: date-time
          nullable: true
          description: When compensation was waived
        waived_by:
          type: string
          nullable: true
          description: Who waived this compensation action
        executed_at:
          type: string
          format: date-time
          nullable: true
          description: When compensation was executed
        executed_by:
          type: string
          nullable: true
          description: Who executed this compensation action
        failed_at:
          type: string
          format: date-time
          nullable: true
          description: When compensation failed

    ListCompensationActionsResponse:
      type: object
      required: [compensation_actions, total]
      properties:
        compensation_actions:
          type: array
          items:
            $ref: '#/components/schemas/FullCompensationAction'
        total:
          type: integer

    ApproveCompensationActionBody:
      type: object
      description: Phase 3 Batch 1 request body for approving a compensation action
      required: [lock_version]
      properties:
        lock_version:
          type: integer
          description: Lock version for optimistic concurrency control
        approved_by:
          type: string
          nullable: true
          description: Optional actor who approved (for audit purposes)

    WaiveCompensationActionBody:
      type: object
      description: Phase 3 Batch 1 request body for waiving a compensation action
      required: [lock_version]
      properties:
        lock_version:
          type: integer
          description: Lock version for optimistic concurrency control
        waived_by:
          type: string
          nullable: true
          description: Optional actor who waived (for audit purposes)

    ExecuteCompensationActionBody:
      type: object
      description: Phase 3 Batch 1 request body for executing a compensation action
      properties:
        executed_by:
          type: string
          nullable: true
          description: Optional actor who executed (for audit purposes)

    ReapproveCompensationActionBody:
      type: object
      description: Phase 3 Batch 1 request body for reapproving a failed compensation action
      properties:
        lock_version:
          type: integer
          description: Lock version for optimistic concurrency control

    ListDlqCandidatesResponse:
      type: object
      description: Phase 3 Batch 1 response for listing DLQ candidates
      properties:
        dlq_candidates:
          type: array
          items:
            $ref: '#/components/schemas/CompensationActionResponse'
          description: List of DLQ candidate compensation actions
        total:
          type: integer
          description: Total count of DLQ candidates

    BatchCandidatesSummary:
      type: object
      description: Phase 3 Batch 1 summary counts for batch candidate categories
      properties:
        pending_approval_count:
          type: integer
          description: Count of pending approval candidates
        approved_auto_executable_count:
          type: integer
          description: Count of approved auto-executable candidates
        retryable_failed_count:
          type: integer
          description: Count of retryable failed candidates
        dlq_count:
          type: integer
          description: Count of DLQ candidate actions

    ListBatchCandidatesResponse:
      type: object
      description: Phase 3 Batch 1 response for listing batch candidates across all categories
      properties:
        pending_approval_candidates:
          type: array
          items:
            $ref: '#/components/schemas/CompensationActionResponse'
          description: Actions in Pending status awaiting approval
        approved_auto_executable_candidates:
          type: array
          items:
            $ref: '#/components/schemas/CompensationActionResponse'
          description: Approved actions with Automatic feasibility that can be auto-executed
        retryable_failed_candidates:
          type: array
          items:
            $ref: '#/components/schemas/CompensationActionResponse'
          description: Failed actions that can be reapproved (retryable error + budget remains)
        dlq_candidates:
          type: array
          items:
            $ref: '#/components/schemas/CompensationActionResponse'
          description: Failed actions that exhausted retry budget or have non-retryable errors
        summary:
          $ref: '#/components/schemas/BatchCandidatesSummary'

    # ----- Policy Gate Evaluation (Phase 3 Batch 1) -----
    CompensationPolicyGateResponse:
      type: object
      description: |
        Phase 3 Batch 1 (bounded read-only slice): Response for policy gate evaluation.
        Returns gate evaluations and risk metadata for compensation actions.
      required: [tenant_id, evaluations, summary]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Tenant ID
        intent_id:
          type: string
          format: uuid
          nullable: true
          description: Intent ID (set for intent-scoped queries)
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/PolicyGateEvaluationResponse'
          description: Individual action evaluations
        summary:
          $ref: '#/components/schemas/PolicyGateSummaryResponse'

    PolicyGateEvaluationResponse:
      type: object
      description: Policy gate evaluation for a single action
      required: [action, gate_status, gate_reason, policy_metadata, risk_metadata]
      properties:
        action:
          $ref: '#/components/schemas/FullCompensationAction'
        gate_status:
          type: string
          enum: [eligible, blocked, manual_review_required]
          description: Canonical gate status
        gate_reason:
          type: string
          description: Human-readable reason for gate status
        policy_metadata:
          $ref: '#/components/schemas/PolicyGateMetadataResponse'
        risk_metadata:
          $ref: '#/components/schemas/RiskMetadataResponse'

    PolicyGateMetadataResponse:
      type: object
      description: Supporting policy metadata for gate evaluation
      properties:
        auto_executable:
          type: boolean
          description: Whether action is auto-executable
        is_dlq_candidate:
          type: boolean
          description: Whether action is a DLQ candidate
        can_reapprove:
          type: boolean
          description: Whether action can be reapproved
        retry_budget_exhausted:
          type: boolean
          description: Whether retry budget is exhausted
        has_non_retryable_error:
          type: boolean
          description: Whether action has non-retryable error
        feasibility:
          type: string
          description: Feasibility level
        strategy_type:
          type: string
          description: Strategy type
        status:
          type: string
          description: Current status
        attempt_count:
          type: integer
          description: Number of attempts made
        max_retries:
          type: integer
          description: Maximum retries allowed

    RiskMetadataResponse:
      type: object
      description: |
        Phase 3 Batch 1 (bounded read-only slice): Risk metadata derived from action state.
        No new policy engine - all fields derive from existing persisted fields.
      properties:
        strategy_severity:
          type: string
          enum: [low, medium, high, critical]
          description: Severity of the compensation strategy
        retry_exhaustion_risk:
          type: string
          enum: [low, medium, high, critical]
          description: Risk level for retry exhaustion
        feasibility_risk:
          type: string
          enum: [low, medium, high, critical]
          description: Risk based on feasibility level
        error_severity:
          type: string
          enum: [none, low, medium, high]
          description: Error severity if failed
        retry_budget_remaining:
          type: integer
          description: Number of retry attempts remaining
        error_classification:
          type: object
          nullable: true
          properties:
            error_code:
              type: string
            retryable:
              type: boolean
            reason:
              type: string
        is_terminal:
          type: boolean
          description: Whether action is in terminal state
        requires_manual_intervention:
          type: boolean
          description: Whether manual intervention is required

    PolicyGateSummaryResponse:
      type: object
      description: Summary of policy gate evaluations
      properties:
        total_actions:
          type: integer
          description: Total number of actions evaluated
        eligible_count:
          type: integer
          description: Number of eligible actions
        blocked_count:
          type: integer
          description: Number of blocked actions
        manual_review_required_count:
          type: integer
          description: Number of actions requiring manual review
        dlq_candidate_count:
          type: integer
          description: Number of DLQ candidates
        pending_approval_count:
          type: integer
          description: Number of actions pending approval
        auto_executable_count:
          type: integer
          description: Number of auto-executable actions

    # ----- Orchestration Coordination Status (Phase 3 Batch 1) -----
    OrchestrationCoordinationResponse:
      type: object
      description: |
        Phase 3 Batch 1 (bounded read-only orchestration coordination view): Response for
        orchestration coordination status. Returns coordination records and summary for
        compensation actions.
      required: [tenant_id, records, summary]
      properties:
        tenant_id:
          type: string
          format: uuid
          description: Tenant ID
        intent_id:
          type: string
          format: uuid
          nullable: true
          description: Intent ID (set for intent-scoped queries)
        records:
          type: array
          items:
            $ref: '#/components/schemas/CoordinationRecordResponse'
          description: Per-item coordination records
        summary:
          $ref: '#/components/schemas/CoordinationSummaryResponse'

    CoordinationRecordResponse:
      type: object
      description: Coordination record for a single compensation action
      required: [action, coordination_status, coordination_reason, auto_executable, is_dlq_candidate, can_reapprove, retry_budget_exhausted, feasibility, strategy_type, status, attempt_count, max_retries]
      properties:
        action:
          $ref: '#/components/schemas/FullCompensationAction'
        coordination_status:
          type: string
          enum: [ready, awaiting_policy, awaiting_manual_review, blocked, terminal]
          description: Canonical coordination status
        coordination_reason:
          type: string
          description: Human-readable reason for coordination status
        auto_executable:
          type: boolean
          description: Whether action is auto-executable
        is_dlq_candidate:
          type: boolean
          description: Whether action is a DLQ candidate
        can_reapprove:
          type: boolean
          description: Whether action can be reapproved after failure
        retry_budget_exhausted:
          type: boolean
          description: Whether retry budget is exhausted
        feasibility:
          type: string
          description: Feasibility level
        strategy_type:
          type: string
          description: Strategy type
        status:
          type: string
          description: Current status
        attempt_count:
          type: integer
          description: Number of attempts made
        max_retries:
          type: integer
          description: Maximum retries allowed

    CoordinationSummaryResponse:
      type: object
      description: Summary of coordination records
      properties:
        total_actions:
          type: integer
          description: Total number of actions
        ready_count:
          type: integer
          description: Number of ready actions
        awaiting_policy_count:
          type: integer
          description: Number of actions awaiting policy
        awaiting_manual_review_count:
          type: integer
          description: Number of actions awaiting manual review
        blocked_count:
          type: integer
          description: Number of blocked actions
        terminal_count:
          type: integer
          description: Number of actions in terminal state
        dlq_candidate_count:
          type: integer
          description: Number of DLQ candidates
        auto_executable_count:
          type: integer
          description: Number of auto-executable actions

    CompensationActionResponse:
      type: object
      description: Phase 3 Batch 1 response for compensation action mutation (approve/waive/execute)
      required: [id, tenant_id, intent_id, status, strategy_type, feasibility, rationale, attempt_count, lock_version]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for this compensation action
        tenant_id:
          type: string
          format: uuid
          description: Tenant this compensation action belongs to
        intent_id:
          type: string
          format: uuid
          description: Intent ID this compensation action is scoped to
        status:
          $ref: '#/components/schemas/CompensationStatus'
          description: Current status of the compensation action
        strategy_type:
          type: string
          description: Compensation strategy type
        feasibility:
          type: string
          description: Feasibility level for compensation
        rationale:
          type: string
          description: Human-readable rationale for the compensation
        attempt_count:
          type: integer
          description: Execution attempt counter
        lock_version:
          type: integer
          description: Lock version for optimistic concurrency
        approved_at:
          type: string
          format: date-time
          nullable: true
          description: When compensation was approved
        approved_by:
          type: string
          nullable: true
          description: Who approved this compensation action
        waived_at:
          type: string
          format: date-time
          nullable: true
          description: When compensation was waived
        waived_by:
          type: string
          nullable: true
          description: Who waived this compensation action
        executed_at:
          type: string
          format: date-time
          nullable: true
          description: When compensation was executed
        executed_by:
          type: string
          nullable: true
          description: Who executed this compensation action
        failed_at:
          type: string
          format: date-time
          nullable: true
          description: When compensation failed
        execution_result_payload:
          type: object
          nullable: true
          description: Execution result context captured after executor runs

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable error message
            retryable:
              type: boolean
              default: false
            details:
              type: object
              additionalProperties: true
