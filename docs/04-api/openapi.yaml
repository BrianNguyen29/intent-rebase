            schema:
              $ref: '#/components/schemas/ApproveApprovalRequestBody'
      responses:
        '200':
          description: Approval request approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResponse'
        '404':
          description: Approval request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Approval request is not in pending status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /approval-requests/{approval_request_id}/reject:
    post:
      tags:
        - approvals
      summary: Reject an approval request
      description: |
        Rejects a pending approval request.

        **Phase 2b bounded slice:** Only updates status to rejected and emits ApprovalRevoked audit event.
        Does NOT resume or re-trigger apply.
      operationId: rejectApprovalRequest
      parameters:
        - name: approval_request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Approval request ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectApprovalRequestBody'
      responses:
        '200':
          description: Approval request rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequestResponse'
        '404':
          description: Approval request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Approval request is not in pending status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /approval-requests/trigger-reapproval:
    post:
      tags:
        - approvals
      summary: Trigger re-approval for scope change
      description: |
        Creates a pending approval request when scope hashes differ.

        **ADR-07 bounded slice:** This endpoint creates a new approval request record
        for re-approval when the approval scope has changed.

        **Behavior:**
        - If `original_scope_hash != current_scope_hash`: Creates new pending approval request
        - If `original_scope_hash == current_scope_hash`: Returns 400 Bad Request (no scope drift)

        **Scope limitations:**
        - Does NOT send notifications (Phase 3 external notification system)
        - Does NOT auto-invalidate existing approvals
        - Does NOT trigger rebase or orchestration
        - Does NOT claim production readiness

        **Use case:** Called by external systems that detect scope drift and need to
        trigger a new approval cycle while preserving audit trail.
      operationId: triggerReapproval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerReapprovalRequest'
      responses:
        '201':
          description: Re-approval triggered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerReapprovalResponse'
        '400':
          description: Scope hashes match - no re-approval required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Intent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

