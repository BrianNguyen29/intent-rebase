    IntentReferences:
      type: object
      required: [specs, tickets, repos, policies]
      properties:
        specs:
          type: array
          items:
            $ref: '#/components/schemas/DocRef'
        tickets:
          type: array
          items:
            $ref: '#/components/schemas/DocRef'
        repos:
          type: array
          items:
            $ref: '#/components/schemas/DocRef'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/DocRef'

    IntentAssumptions:
      type: object
      required: [explicit]
      properties:
