        is provided with sufficient fields, also records a side effect to the compensation
        ledger (capture-on-write groundwork).

        **Validation:**
        - `tenant_id` cannot be nil UUID
        - `workflow_id` cannot be nil UUID
        - `label` cannot be empty or whitespace-only
        - `external_ref.ref_id` cannot be nil UUID
      operationId: ingestArtifact
