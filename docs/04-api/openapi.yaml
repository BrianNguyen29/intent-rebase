  /compensation-actions/{action_id}/execute:
    post:
      tags:
        - compensation
      summary: Execute an approved compensation action
      description: |
        Phase 3 Batch 1 (bounded execution slice): Executes an Approved compensation action
        using the bounded RollbackExecutor.

        **Executor gate:** Only Approved actions can execute. This prevents accidental
        execution of pending or already-processed actions.

        **Execution policy gate:** Only service-executable combos can execute:
        - Rollback + Automatic feasibility (S1InternalReversible)
        - CounterAction + SemiAutomatic feasibility (S2ExternalReversible)
        - FollowupNotice + ManualOnly feasibility (S3ExternalPartiallyReversible)
        - Escalation + NotPossible feasibility (S4Irreversible)

        All four combos are service-executable in this slice. Human-intervention workflows
        for other feasibility levels or strategy types are not in this slice.

        **Bounded executor semantics (Phase 3 Batch 1):**
        - Rollback + Automatic: validates side effect context against ledger, returns acknowledgment
        - CounterAction + SemiAutomatic: bounded execution, returns acknowledgment
        - FollowupNotice + ManualOnly: bounded execution, returns acknowledgment
        - Escalation + NotPossible: bounded execution, returns acknowledgment
        - Missing side effect: fail closed with `SIDE_EFFECT_NOT_FOUND`
        - Success summary is truthful: does not claim unreversible actions are reversed
        - Does NOT claim external reversal — current data model does not support actual artifact reversal

        **Fails closed on illegal transitions:**
        - Returns 409 Conflict if action is not Approved
        - Returns 409 Conflict if combo is not one of the four service-executable combos

        **This slice:** No retry logic; Failed actions remain Failed.
      operationId: executeCompensationAction
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Compensation action ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCompensationActionBody'
      responses:
        '200':
          description: Compensation action executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompensationActionResponse'
        '404':
          description: Compensation action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Compensation action is not Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /compensation-actions/{action_id}/reapprove:
    post:
      tags:
        - compensation
      summary: Manually reapprove a failed compensation action
      description: |
        Phase 3 Batch 1 (bounded manual retry slice): Transitions a Failed compensation
        action back to Pending status, enabling it to be approved and executed again.

        **Policy gates (fail closed):**
        - Action must be in Failed status
        - Action must have remaining retry budget (attempt_count < max_retries)
        - Error code must be retryable (not a permanent failure)

        **Fails closed when:**
        - Action is not in Failed status → 409 Conflict
        - Retry budget exhausted → 409 Conflict
        - Error is non-retryable → 409 Conflict
        - Optimistic lock conflict → 409 Conflict

        **Note:** This does NOT reset the attempt_count. The action retains its
        failure history. Reapproval just allows another execution attempt within
        the retry budget.
      operationId: reapproveCompensationAction
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Compensation action ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReapproveCompensationActionBody'
      responses:
        '200':
          description: Compensation action reapproved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompensationActionResponse'
        '404':
          description: Compensation action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Compensation action cannot be reapproved (policy gate failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

