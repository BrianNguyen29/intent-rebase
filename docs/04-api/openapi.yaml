  /forensic/verify:
    post:
      tags:
        - forensic
      summary: Verify forensic bundle feasibility
      description: |
        Phase 3 Batch 3b (bounded slice): Verifies whether a forensic bundle can be
        generated for the given parameters WITHOUT generating actual bundles.

        **Bounded request-driven verification:**
        - Accepts verification parameters (intent_id, time_range, purpose)
        - Validates entity existence and coverage
        - Reports what a bundle WOULD contain (counts, not actual data)
        - Does NOT generate bundles, store data, or perform replay

        **Truthful status semantics:**
        - `ready`: All referenced entities exist and are within time range
        - `incomplete`: Some entities are missing or time range has gaps
        - `not_supported`: Verification mode not implemented
        - `estimated_bundle_item_count` is an estimate, NOT actual bundle size

        **NOT claimed:**
        - Bundle generation (actual data collection)
        - Bundle storage (S3 or any persistence)
        - Bundle retrieval (downloading stored bundles)
        - Bundle replay (reproducing state from a bundle)
        - Hash chain integrity verification (requires generated bundle)
      operationId: verifyForensicBundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForensicVerificationRequest'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForensicVerificationResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /forensic/export:
    post:
      tags:
        - forensic
      summary: Generate forensic archive for download
      description: |
        Phase 3 Batch 3b (bounded slice): Generates an in-memory forensic archive
        from the given parameters. The archive contains scaffolded/fictional data
        representing what a real bundle would contain.

        **Bounded in-memory archive generation:**
        - Accepts export parameters (intent_id, time_range, purpose)
        - Generates scaffolded entries entirely in-memory (no real service queries)
        - Returns archive metadata including size, content type, and item count
        - Returns archive metadata only in this bounded slice (no archive byte streaming)

        **Truthful semantics:**
        - `archive_id` is a unique identifier for the generated archive
        - `generated_at` timestamps when generation was triggered
        - `item_count` reflects the count of scaffolded entries generated
        - `archive_size_bytes` reflects the JSON-serialized size
        - Entries contain scaffolded data (NOT actual intent versions, artifacts, etc.)

        **NOT claimed:**
        - Actual bundle generation from real services (intent service, graph service, etc.)
        - Bundle storage (S3 or any persistence layer)
        - Async job orchestration for bundle generation
        - Real replay engine (state reproduction from bundle)
        - Hash chain integrity verification
      operationId: exportForensicArchive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForensicExportRequest'
      responses:
        '200':
          description: Export archive metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForensicExportResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Forensic Bundle Endpoints (Phase 3 Batch 3b P4 bounded slice)
  # Bounded scope note: This is a local/exportable bundle download path.
  # Not a full S3/production storage pipeline. S3 integration is Phase 4 scope.

  /forensic-bundles:
    post:
      tags:
        - forensic
      summary: Create a new forensic bundle
      description: |
        Phase 3 Batch 3b (P4 bounded slice): Creates a new forensic bundle manifest
        with Pending status. The bundle generation service manages the lifecycle
        (Pending -> Generating -> Ready/Failed).
      operationId: createForensicBundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateForensicBundleRequest'
      responses:
        '201':
          description: Bundle created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateForensicBundleResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - forensic
      summary: List forensic bundles for a tenant
      description: |
        Phase 3 Batch 3b (P4 bounded slice): Returns all forensic bundles
        for the specified tenant, ordered by created_at descending.
      operationId: listForensicBundles
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Bundles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListForensicBundlesResponse'

  /forensic-bundles/{bundle_id}:
    get:
      tags:
        - forensic
      summary: Get a forensic bundle by ID
      description: |
        Phase 3 Batch 3b (P4 bounded slice): Returns a single forensic bundle
        by its ID, scoped to the specified tenant. Returns 404 if bundle not found
        or if the bundle belongs to a different tenant (fail-not-found pattern).
      operationId: getForensicBundle
      parameters:
        - name: bundle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bundle found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForensicBundle'
        '404':
          description: Bundle not found or tenant mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /forensic-bundles/{bundle_id}/download:
    get:
      tags:
        - forensic
      summary: Download a forensic bundle as JSON
      description: |
        Phase 3 Batch 3b (P4 bounded slice): Downloads a forensic bundle as a JSON file.
        Returns the bundle manifest serialized to JSON format with Content-Disposition
        header set for download.

        Bounded slice scope:
        - Returns bundle manifest as downloadable JSON (no actual content files)
        - No S3 storage integration - bundle is returned directly from repository
        - No content collection - manifest only

        Truthful description: This is a local/exportable bundle download path.
        Not a full S3/production storage pipeline.
      operationId: downloadForensicBundle
      parameters:
        - name: bundle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Bundle downloaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForensicBundle'
          headers:
            Content-Disposition:
              description: Attachment filename for download
              schema:
                type: string
                example: 'attachment; filename="forensic-bundle-{bundle_id}-{timestamp}.json"'
        '404':
          description: Bundle not found or tenant mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /forensic-bundles/{bundle_id}/transition-to-generating:
    post:
      tags:
        - forensic
      summary: Transition bundle to Generating status
      description: |
        Phase 3 Batch 3b (P4 bounded slice): Transitions a Pending bundle to Generating.
        This is a placeholder for actual content collection (Phase 4 scope).

        **Tenant isolation:** Requires tenant_id query parameter. Returns 404 if bundle
        not found or if the bundle belongs to a different tenant (fail-not-found pattern).
      operationId: transitionBundleToGenerating
      parameters:
        - name: bundle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant ID for ownership verification
      responses:
        '200':
          description: Bundle transitioned to Generating
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForensicBundle'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /forensic-bundles/{bundle_id}/transition-to-ready:
    post:
      tags:
        - forensic
      summary: Transition bundle to Ready status
      description: |
        Phase 3 Batch 3b (P4 bounded slice): Transitions a Generating bundle to Ready.
        This is a placeholder for actual bundle assembly (Phase 4 scope).

        **Tenant isolation:** Requires tenant_id query parameter. Returns 404 if bundle
        not found or if the bundle belongs to a different tenant (fail-not-found pattern).
      operationId: transitionBundleToReady
      parameters:
        - name: bundle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant ID for ownership verification
      responses:
        '200':
          description: Bundle transitioned to Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForensicBundle'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bundle not found or tenant mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /forensic-bundles/{bundle_id}/transition-to-failed:
    post:
      tags:
        - forensic
      summary: Transition bundle to Failed status
      description: |
        Phase 3 Batch 3b (P4 bounded slice): Transitions a Generating bundle to Failed.

        **Tenant isolation:** Requires tenant_id query parameter. Returns 404 if bundle
        not found or if the bundle belongs to a different tenant (fail-not-found pattern).
      operationId: transitionBundleToFailed
      parameters:
        - name: bundle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant ID for ownership verification
      responses:
        '200':
          description: Bundle transitioned to Failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForensicBundle'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bundle not found or tenant mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /forensic-bundles/{bundle_id}/complete:
    post:
      tags:
        - forensic
      summary: Complete bundle creation
      description: |
        Phase 3 Batch 3b (P4 bounded slice): Transitions a bundle through the full
        Pending -> Generating -> Ready lifecycle. This is a convenience method for
        testing the complete flow.

        **Tenant isolation:** Requires tenant_id query parameter. Returns 404 if bundle
        not found or if the bundle belongs to a different tenant (fail-not-found pattern).
      operationId: completeForensicBundle
      parameters:
        - name: bundle_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant ID for ownership verification
      responses:
        '200':
          description: Bundle creation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForensicBundle'
        '400':
          description: Invalid status transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Bundle not found or tenant mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    # ----- Core Types -----
    ActorRef:
      type: object
      required: [actor_type, actor_id]
      properties:
        actor_type:
          type: string
          description: Type of actor (e.g., "user", "service", "system")
        actor_id:
          type: string
          description: Identifier of the actor

    SourceRef:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          description: Type of source (e.g., "spec", "ticket", "doc")
        id:
          type: string
          description: Source identifier

    ExternalRef:
      type: object
      required: [ref_type, ref_id]
      properties:
        ref_type:
          $ref: '#/components/schemas/ExternalRefType'
        ref_id:
          type: string
          format: uuid
          description: UUID of the referenced entity

    ChangeChannel:
      type: string
      enum: [user_edit, webhook, policy_update, system_normalization]
      description: How the version was created

    IntentStatus:
      type: string
      enum: [active, archived, superseded]
      description: Status of the intent document

    VersionStatus:
      type: string
      enum: [draft, active, rejected, superseded]
      description: Status of an intent version

    ClauseType:
      type: string
      enum: [functional, non_functional, policy, budget, time]

    ConstraintOperator:
      type: string
      enum: [eq, neq, lt, lte, gt, gte, contains, not_contains, regex, custom]

    ClausePriority:
      type: string
      enum: [must, should, could]

    RiskTier:
      type: string
      enum: [low, medium, high, critical]

    Urgency:
      type: string
      enum: [low, medium, high, critical]

    TradeoffDimension:
      type: string
      enum: [speed, cost, quality, risk, compatibility, latency]

    TradeoffPreference:
      type: string
      enum: [prioritize, balance, minimize, maximize]

    # ----- Payload Structure -----
    IntentObjective:
      type: object
      required: [summary, success_statement, domain]
      properties:
        summary:
          type: string
        success_statement:
          type: string
        domain:
          type: string

    IntentScope:
      type: object
      required: [in_scope, out_of_scope]
      properties:
        in_scope:
          type: array
          items:
            type: string
        out_of_scope:
          type: array
          items:
            type: string

    Constraint:
      type: object
      required: [type, key, operator, value, priority]
      properties:
        clause_id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ClauseType'
        key:
          type: string
        operator:
          $ref: '#/components/schemas/ConstraintOperator'
        value: {}
        rationale:
          type: string
        priority:
          $ref: '#/components/schemas/ClausePriority'

    IntentConstraints:
      type: object
