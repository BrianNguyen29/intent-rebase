  - name: compensation
    description: Compensation action mutation endpoints (Phase 3 Batch 1 bounded execution slice)

paths:
  /intents:
    post:
      tags:
        - intents
      summary: Create a new intent
      description: Creates a new intent with initial version (v1)
      operationId: createIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntentRequest'
      responses:
        '201':
          description: Intent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateIntentResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /intents/{intent_id}:
    get:
      tags:
        - intents
      summary: Get intent head (current version)
      description: Returns the intent document with its current (head) version
      operationId: getIntentHead
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
      responses:
        '200':
          description: Intent found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentHeadResponse'
        '404':
          description: Intent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /intents/{intent_id}/versions:
    post:
      tags:
        - versions
      summary: Create a new version
      description: |
        Creates a new version of an existing intent.

        **Optimistic Concurrency Control (OCC):**
        - `X-Expected-Version` (optional): The version number the client believes is current.
          If provided and doesn't match, returns 409 Conflict.
          If header is present but not a valid integer, returns 400 Bad Request.
        - `X-Expected-Row-Version` (optional): The row_version the client last observed.
          If provided and doesn't match, returns 409 Conflict.
          If header is present but not a valid integer, returns 400 Bad Request.

        If headers are omitted, the service uses the current server state (current_version and
        row_version) as the expected values. This means the OCC check still occurs, but against
        whatever is currently stored — allowing concurrent overwrites if multiple clients omit headers.
        Clients that need deterministic OCC protection should provide both headers.
      operationId: createVersion
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
        - name: X-Expected-Version
          in: header
          required: false
          schema:
            type: integer
          description: Expected current version for OCC check
        - name: X-Expected-Row-Version
          in: header
          required: false
          schema:
            type: integer
          description: Expected row_version for OCC check
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVersionRequest'
      responses:
        '201':
          description: Version created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateVersionResponse'
        '400':
          description: Invalid request - malformed header or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Intent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Concurrency conflict - intent has been modified since last read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - versions
      summary: List all versions
      description: Returns all versions of an intent in descending version order
      operationId: listVersions
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
      responses:
        '200':
          description: Versions found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVersionsResponse'
        '404':
          description: Intent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /intents/{intent_id}/versions/{version_number}:
    get:
      tags:
        - versions
      summary: Get specific version
      description: Returns a specific version of an intent by version number
      operationId: getVersion
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
        - name: version_number
          in: path
          required: true
          schema:
            type: integer
          description: Version number
      responses:
        '200':
          description: Version found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentVersion'
        '404':
          description: Version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /intents/{intent_id}/diff:
    post:
      tags:
        - diff
      summary: Compute diff between two versions
      description: |
        Computes a semantic diff between two versions of an intent.

        The diff covers scope, constraints, acceptance_criteria, and authority sections.
        Returns structured diff output plus risk analysis (severity, confidence, manual-review).

        **Version ordering:**
        - `from_version` must be less than `to_version`
        - Both versions must belong to the same intent
        - Both versions must exist
      operationId: computeDiff
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiffRequest'
      responses:
        '200':
          description: Diff computed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffResponse'
        '400':
          description: Invalid request - bad version ordering or versions from different intents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Intent or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /intents/{intent_id}/rebase-preview:
    post:
      tags:
        - rebase
      summary: Generate rebase preview plan
      description: |
        Generates a preview rebase plan between two versions of an intent.

        The preview uses diff+risk analysis to produce a decision class (A-E),
        rationale, and section-level decisions.

        **Phase 1 PR #16: Graph-integrated affected items:**
        When graph service is available and the IntentVersion node exists in the graph,
        the response includes classified affected items (artifacts, approvals, side effects).
        The `affected_items.status` field indicates whether classification succeeded:
        - `available`: Graph data found and items classified
        - `unavailable`: Graph node not found or service unavailable
        
        **Phase 1 PR #17: Apply/checkpoint groundwork (internal typed contracts, not executed):**
        Rebase engine internals now use typed readiness contracts for checkpoint selection,
        approval revalidation, and compensation planning, but those deferred fields are
        not exposed in the Phase 1 preview response yet.
        
        **Apply endpoint NOT implemented in Phase 1** — POST /intents/{id}/rebase-apply deferred to Phase 2.

        **Reliability:** The endpoint remains functional even when graph coverage is incomplete.
        A `status: unavailable` does NOT cause a 500 error.

        **Version ordering:**
        - `from_version` must be less than `to_version`
        - Both versions must belong to the same intent
        - Both versions must exist
      operationId: computeRebasePreview
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiffRequest'
      responses:
        '200':
          description: Rebase preview computed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebasePreviewResponse'
        '400':
          description: Invalid request - bad version ordering or versions from different intents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Intent or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /intents/{intent_id}/rebase-apply:
    post:
      tags:
        - rebase
      summary: Apply a rebase directive
      description: |
        Executes the current bounded rebase-apply path for an intent version transition.

        **Phase 2b risk-tier policy contract:**
        The apply decision is controlled by `risk_tier` (the primary public risk field):
        - LOW risk_tier: automatic, no approval required, no notification
        - MEDIUM risk_tier: automatic with notification
        - HIGH/CRITICAL risk_tier: blocked, requires manual approval
        - Class A (no semantic changes): always no-op regardless of risk_tier

        The `decision_class` (A-E) and `risk_level` (1-5) fields remain available
        as supporting context for audit and display purposes.

        **Runtime execution semantics:**
        - Runtime signal delivery is best-effort and does not block the API response.
        - Temporal replay is currently implemented as cooperative signal-based replay with
          checkpoint context, not native Temporal reset.

        **HTTP status codes:**
        - 200: Rebase applied (auto-proceed or no-op)
        - 202: Rebase blocked, requires manual review (HIGH/CRITICAL risk_tier)
      operationId: applyRebase
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiffRequest'
      responses:
        '200':
          description: Rebase applied or determined to be a no-op
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebaseApplyResponse'
        '202':
          description: Rebase requires manual review and was not auto-applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RebaseApplyResponse'
        '400':
          description: Invalid request - bad version ordering or versions from different intents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Intent or version not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /intents/{intent_id}/replay:
    post:
      tags:
        - rebase
      summary: Initiate a bounded replay operation
      description: |
        Phase 2b bounded replay slice: Initiates cooperative signal-based replay
        using existing runtime/checkpoint seams. This is NOT native Temporal reset.

        **Checkpoint selection strategy (bounded):**
        - If `checkpoint_id` is provided in request, use that specific checkpoint
        - Otherwise, use the most recent active checkpoint for the workflow

        **Replay semantics:**
        - Uses existing `replay_from_checkpoint` runtime adapter seam
        - Returns bounded outcome with checkpoint alignment details
        - Does not imply full Phase 2 replay compatibility (event streaming, replay override, etc.)

        **HTTP status codes:**
        - 200: Replay initiated with checkpoint alignment result
        - 400: Invalid request (version not found, etc.)
        - 404: Intent not found
        - 500: Internal server error
      operationId: replayIntent
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplayRequest'
      responses:
        '200':
          description: Replay initiated with bounded outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplayResponse'
        '400':
          description: Invalid request - checkpoint not found or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Intent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /intents/{intent_id}/side-effects:
    get:
      tags:
        - side-effects
      summary: List side effects for an intent
      description: |
        Phase 3 Batch 1 (groundwork): Returns all side effects recorded for the given
        intent, scoped to the specified tenant. Side effects are ordered by
        occurred_at descending (newest first).

        This endpoint provides the query API for compensation planning input.
        The actual compensation planning/execution is not included in this slice.
      operationId: listSideEffects
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant ID to scope the query
      responses:
        '200':
          description: Side effects retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSideEffectsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /intents/{intent_id}/orchestration-dashboard:
    get:
      tags:
        - compensation
      summary: Intent orchestration dashboard (read-only)
      description: |
        Phase 3 Batch 1 (bounded read-only slice): Returns a consolidated view
        of side effects and compensation actions for a single intent within a tenant.

        **This endpoint is READ-ONLY** - it does not trigger compensation execution,
        approval workflows, or any mutation. It only queries existing data and
        computes summary statistics.

        **Truthful summary fields:**
        - `side_effect_summary.total`: count of all side effects for this intent
        - `side_effect_summary.irreversible_count`: count of S4Irreversible side effects
        - `side_effect_summary.auto_compensatable_count`: count of S0/S1 side effects
        - `compensation_action_summary.status_counts.*`: count by CompensationStatus
        - `compensation_action_summary.retryable_failed_count`: Failed actions with retryable errors
        - `compensation_action_summary.dlq_candidate_count`: Failed + exhausted budget OR non-retryable error
        - `compensation_action_summary.reapprovable_count`: Failed + retryable error + remaining budget
        - `compensation_action_summary.auto_executable_count`: Approved + Automatic feasibility

        **No batch execution or orchestration engine claims:**
        This endpoint only aggregates existing persisted data. It does not execute
        any compensation actions, trigger workflows, or involve background processing.
      operationId: getOrchestrationDashboard
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant ID to scope the query
      responses:
        '200':
          description: Orchestration dashboard retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchestrationDashboardResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /intents/{intent_id}/compensation-actions:
    get:
      tags:
        - compensation
      summary: List compensation actions for an intent
      description: |
        Phase 3 Batch 1 (bounded read-only slice): Returns all compensation actions
        recorded for the given intent, scoped to the specified tenant. Actions are
        ordered by generated_at descending (newest first).

        **This endpoint is READ-ONLY** - it does not trigger compensation execution,
        approval workflows, or any mutation. It only queries existing compensation
        action records.

        **Planner vs Executor distinction:**
        - This endpoint returns actual compensation action records stored via the
          compensation action service/repository
        - The `compensation_planning` field in rebase-preview/apply responses shows
          planner-generated skeleton/preview data (not stored records)
        - Full compensation execution (executor trigger) is Batch 1+ scope
      operationId: listCompensationActions
      parameters:
        - name: intent_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Intent ID
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant ID to scope the query
      responses:
        '200':
          description: Compensation actions retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCompensationActionsResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /compensation-actions/{action_id}/approve:
    post:
      tags:
        - compensation
      summary: Approve a pending compensation action
      description: |
        Phase 3 Batch 1 (bounded execution slice): Transitions a Pending compensation action
        to Approved status, enabling it to be executed via POST /compensation-actions/{action_id}/execute.

        **Transition rules:**
        - Only Pending actions can be approved
        - Uses optimistic locking via lock_version to prevent concurrent updates

        **Fails closed on illegal transitions:**
        - Returns 409 Conflict if action is not Pending
        - Returns 409 Conflict if lock_version doesn't match

        **Executor gate:** Approved actions can be executed via POST /compensation-actions/{action_id}/execute
      operationId: approveCompensationAction
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Compensation action ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveCompensationActionBody'
      responses:
        '200':
          description: Compensation action approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompensationActionResponse'
        '404':
          description: Compensation action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Compensation action is not Pending or lock_version mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /compensation-actions/{action_id}/waive:
    post:
      tags:
        - compensation
      summary: Waive a pending compensation action
      description: |
        Phase 3 Batch 1 (bounded execution slice): Transitions a Pending compensation action
        to Waived status, marking it as intentionally skipped.

        **Transition rules:**
        - Only Pending actions can be waived
        - Uses optimistic locking via lock_version to prevent concurrent updates

        **Fails closed on illegal transitions:**
        - Returns 409 Conflict if action is not Pending
        - Returns 409 Conflict if lock_version doesn't match

        **This slice:** Waived actions are terminal. No reactivation path exists.
      operationId: waiveCompensationAction
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Compensation action ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WaiveCompensationActionBody'
      responses:
        '200':
          description: Compensation action waived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompensationActionResponse'
        '404':
          description: Compensation action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Compensation action is not Pending or lock_version mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /compensation-actions/{action_id}/execute:
    post:
      tags:
        - compensation
      summary: Execute an approved compensation action
      description: |
        Phase 3 Batch 1 (bounded execution slice): Executes an Approved compensation action
        using the bounded RollbackExecutor.

        **Executor gate:** Only Approved actions can execute. This prevents accidental
        execution of pending or already-processed actions.

        **Execution policy gate:** Only actions with `Automatic` feasibility can execute
        in this slice. SemiAutomatic and ManualOnly require human intervention workflows
        that are not in this slice. NotPossible cannot be executed at all.

        **Bounded RollbackExecutor semantics (Phase 3 Batch 1):**
        - Rollback + Automatic: validates side effect context against ledger, returns acknowledgment
        - Non-Rollback strategies: fail closed with `UNSUPPORTED_STRATEGY_TYPE`
        - Non-Automatic feasibility: fail closed with `UNSUPPORTED_FEASIBILITY`
        - Missing side effect: fail closed with `SIDE_EFFECT_NOT_FOUND`
        - Success summary is truthful: "Rollback of {effect_type} targeting {target} acknowledged"
        - Does NOT claim external reversal — current data model does not support actual artifact reversal

        **Fails closed on illegal transitions:**
        - Returns 409 Conflict if action is not Approved
        - Returns 409 Conflict if feasibility is not Automatic

        **This slice:** No retry logic; Failed actions remain Failed.
      operationId: executeCompensationAction
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Compensation action ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteCompensationActionBody'
      responses:
        '200':
          description: Compensation action executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompensationActionResponse'
        '404':
          description: Compensation action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Compensation action is not Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /compensation-actions/{action_id}/reapprove:
    post:
      tags:
        - compensation
      summary: Manually reapprove a failed compensation action
      description: |
        Phase 3 Batch 1 (bounded manual retry slice): Transitions a Failed compensation
        action back to Pending status, enabling it to be approved and executed again.

        **Policy gates (fail closed):**
        - Action must be in Failed status
        - Action must have remaining retry budget (attempt_count < max_retries)
        - Error code must be retryable (not a permanent failure)

        **Fails closed when:**
        - Action is not in Failed status → 409 Conflict
        - Retry budget exhausted → 409 Conflict
        - Error is non-retryable → 409 Conflict
        - Optimistic lock conflict → 409 Conflict

        **Note:** This does NOT reset the attempt_count. The action retains its
        failure history. Reapproval just allows another execution attempt within
        the retry budget.
      operationId: reapproveCompensationAction
      parameters:
        - name: action_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Compensation action ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReapproveCompensationActionBody'
      responses:
        '200':
          description: Compensation action reapproved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompensationActionResponse'
        '404':
          description: Compensation action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Compensation action cannot be reapproved (policy gate failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /compensation-actions/dlq:
    get:
      tags:
        - compensation
      summary: List DLQ (Dead Letter Queue) candidates
      description: |
        Phase 3 Batch 1 (bounded manual retry slice): Returns all compensation
        actions that are DLQ candidates.

        **Derived DLQ condition:** An action is a DLQ candidate when:
        1. Status is Failed AND
        2. Either:
           a. attempt_count >= max_retries (exhausted retry budget), OR
           b. The error code is non-retryable (permanent failure)

        **No DLQ table:** This is a read-only derived query from existing data.
        DLQ candidates cannot be reapproved - they represent failures that have
        exhausted automated retry possibilities.

        **This endpoint is READ-ONLY** - it only queries existing data.
        Manual intervention is the only path forward for DLQ candidates.
      operationId: listDlqCandidates
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant ID to scope the query
      responses:
        '200':
          description: DLQ candidates retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDlqCandidatesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /compensation-actions/batch-candidates:
    get:
      tags:
        - compensation
      summary: List batch candidates across all categories
      description: |
        Phase 3 Batch 1 (bounded read-only batch candidate queue slice): Returns a
        consolidated view of all actionable compensation categories for batch processing.

        **This endpoint is READ-ONLY** - it only queries existing data.

        **Four candidate categories:**
        1. `pending_approval_candidates` - Actions in Pending status awaiting approval
        2. `approved_auto_executable_candidates` - Approved actions with Automatic feasibility
        3. `retryable_failed_candidates` - Failed actions that can be reapproved (retryable error + budget remains)
        4. `dlq_candidates` - Failed actions that exhausted retry budget or have non-retryable errors

        **No execution, orchestration, or policy gate:**
        This is a read-only query endpoint. It does not trigger any mutations,
        execute any actions, or involve background workers.

        **Tenant-scoped:** Results are filtered by the provided tenant_id.
      operationId: listBatchCandidates
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Tenant ID to scope the query
      responses:
        '200':
          description: Batch candidates retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListBatchCandidatesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /compensation-actions/policy-gate:
    get:
      tags:
        - compensation
      summary: Tenant-scoped policy gate evaluation for compensation actions
      description: |
        Phase 3 Batch 1 (bounded read-only slice): Returns policy gate evaluations
        for all compensation actions belonging to the specified tenant.

        **This endpoint is READ-ONLY** - it only queries existing data.

        **Canonical gate statuses:**
        - `eligible`: Action can proceed (Approved + Automatic feasibility + no blocking conditions)
        - `blocked`: Action cannot proceed (DLQ, non-retryable error, exhausted budget, terminal status)
        - `manual_review_required`: Needs human intervention (Pending, SemiAutomatic/ManualOnly feasibility)

        **Gate evaluation is derived from existing surfaces:**
        - Status, feasibility, attempt_count, max_retries, error_code fields
        - No new policy engine or external risk surface is queried

        **Response includes:**
        - Individual action evaluations with gate outcome and reason
        - Summary counts by gate status
        - Policy/risk metadata useful for UI display
