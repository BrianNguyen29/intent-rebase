# Intent Rebase Engine - OpenAPI Specification
#
# Note: This spec is the canonical source for implemented HTTP endpoints.
# HTTP framework: lightweight approach — see docs for decision rationale.
# Phase coverage: Phase 1 + Phase 3 Batch 1 + Phase 3 Batch 3b bounded slices (see implemented sections below).

openapi: 3.1.0
info:
  title: Intent Rebase Engine API
  description: |
    Manages intent lifecycle, versioning, diff computation, rebase preview, and dependency graph operations.

    ## Implemented scopes

    ### Phase 1 — Core Control Plane
    - Health & observability endpoints
    - Intent lifecycle (create/read/version)
    - Intent analysis (validate, diff, rebase-preview)
    - Dependency graph CRUD

    ### Phase 3 Batch 1 — Compensation + Orchestration
    - Side effect capture and query
    - Compensation action CRUD and approve/waive/execute
    - DLQ and batch candidate APIs
    - Policy gate evaluation
    - Orchestration dashboard and coordination view
    - Orchestration dry-run planner and batch approve/reapprove/execute
    - Single-shot orchestration runtime (HTTP + CLI)
    - Compensation simulation: GET /intents/{intent_id}/rebase-simulation and POST /compensation-simulation/run (N4-4 bounded slice; commit fe2a1f6)

    ### Phase 3 Batch 3b — Forensic Replay Verification (bounded slice)
    - Request-driven forensic bundle feasibility verification with real entity counts (commit 7b05c5b)
    - Forensic bundle generation with S3/MinIO persistence seam (POST /forensic/bundle)
    - Forensic archive export (POST /forensic/export)
    - Forensic bundle list and download (GET /forensic-bundles, GET /forensic-bundles/{id}/download)
    - Read-only verification and integrity checking (no full runtime replay)

    ## Bounded scope note
    Phase 3 Batch 1 delivers bounded slices of the compensation engine.
    Full planner/executor/retry/rollback record are Batch 1 scope (Phase 2b exit is closed).

    ## Implemented (Phase 1)
    - GET /health — Service health check
    - GET /ready — Service readiness check
    - GET /metrics — Prometheus metrics endpoint

    ### Intent Lifecycle
    - POST /intents — Create intent with initial version
    - GET /intents/{intent_id} — Get intent head (current version)
    - POST /intents/{intent_id}/versions — Create new version
    - GET /intents/{intent_id}/versions — List all versions (descending order)
    - GET /intents/{intent_id}/versions/{version_number} — Get specific version

    ### Intent Analysis
    - POST /v1/intents/validate — Validate intent payload structure
    - POST /intents/{intent_id}/diff — Compute diff between two versions
    - POST /intents/{intent_id}/rebase-preview — Generate rebase preview plan

    ### Dependency Graph (Phase 1 - CRUD only)
    - POST /v1/graph/nodes — Create graph node
    - GET /v1/graph/nodes — List graph nodes (with optional filters)
    - GET /v1/graph/nodes/{node_id} — Get specific graph node
    - POST /v1/graph/edges — Create graph edge
    - GET /v1/graph/edges — List graph edges (with optional filters)
    - GET /v1/graph/nodes/{node_id}/edges — List edges from a node

    ## Still Open (broader than current bounded slices)
    - Checkpoint lifecycle automation and broader checkpoint query/replay APIs
    - Approval revalidation hooks and policy snapshot lifecycle
    - Event streaming (NATS/Kafka)
    - Full authentication/authorization
    - Replay with intent version override (Phase 3 deferral)
    - Replay audit trail and replay status tracking beyond the bounded replay slice (Phase 3 deferral)
    - Compensation planner: full risk scoring, strategy selection (Batch 1+ scope)
    - Compensation executor: real rollback/counter-action logic (Batch 1+ scope; stub executor implemented)
    - Compensation retry logic: max retries, backoff (Batch 1+ scope)
  version: 0.1.0
  contact:
    name: Intent Rebase Engine Team
    url: https://github.com/BrianNguyen29/intent-rebase
  license:
    name: Apache-2.0

servers:
  - url: /v1
    description: Version 1 API

tags:
  - name: intents
    description: Intent lifecycle operations
  - name: versions
    description: Intent version management
  - name: health
    description: Health and observability endpoints
  - name: graph
    description: Dependency graph CRUD operations
  - name: compensation
    description: Compensation action mutation endpoints (Phase 3 Batch 1 bounded execution slice)
  - name: forensic
    description: Forensic verification endpoints (Phase 3 Batch 3b bounded slice)
  - name: approvals
    description: Approval request management (Phase 2b bounded slice)
  - name: diff
    description: Intent diff computation operations
  - name: rebase
