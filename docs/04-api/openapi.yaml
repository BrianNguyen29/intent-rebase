      properties:
        functional:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
        non_functional:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
        policy:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
        budget:
          type: array
          items:
            $ref: '#/components/schemas/Constraint'
        time:
