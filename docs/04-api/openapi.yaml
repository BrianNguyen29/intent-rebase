# Intent Rebase Engine - OpenAPI Specification
# Phase 1 - Core Control Plane
#
# Note: OpenAPI spec is maintained alongside code as endpoints are implemented.
# HTTP framework choice for Phase 1: lightweight approach - see docs for decision rationale.

openapi: 3.1.0
info:
  title: Intent Rebase Engine API
  description: |
    Phase 1 - Core Control Plane API
    
    Manages intent lifecycle, versioning, diff computation, rebase preview, and dependency graph operations.
    
    ## Implemented (Phase 1)
    
    ### Health & Observability
    - GET /health — Service health check
    - GET /ready — Service readiness check
    - GET /metrics — Prometheus metrics endpoint
    
    ### Intent Lifecycle
    - POST /intents — Create intent with initial version
    - GET /intents/{intent_id} — Get intent head (current version)
    - POST /intents/{intent_id}/versions — Create new version
    - GET /intents/{intent_id}/versions — List all versions (descending order)
    - GET /intents/{intent_id}/versions/{version_number} — Get specific version
    
    ### Intent Analysis
    - POST /v1/intents/validate — Validate intent payload structure
    - POST /intents/{intent_id}/diff — Compute diff between two versions
    - POST /intents/{intent_id}/rebase-preview — Generate rebase preview plan
    
    ### Dependency Graph (Phase 1 - CRUD only)
    - POST /v1/graph/nodes — Create graph node
    - GET /v1/graph/nodes — List graph nodes (with optional filters)
    - GET /v1/graph/nodes/{node_id} — Get specific graph node
    - POST /v1/graph/edges — Create graph edge
    - GET /v1/graph/edges — List graph edges (with optional filters)
    - GET /v1/graph/nodes/{node_id}/edges — List edges from a node
    
    ### Phase 3 Batch 1 (groundwork + bounded execution slice)
    - POST /v1/graph/artifacts — Ingest artifact with optional side effect capture
    - GET /intents/{intent_id}/side-effects — List side effects for an intent (query API for compensation planning input)
    - GET /intents/{intent_id}/compensation-actions — List compensation actions for an intent (read-only query)
    - GET /compensation-actions/policy-gate — Tenant-scoped policy gate evaluation (read-only query)
    - GET /intents/{intent_id}/compensation-policy-gate — Intent-scoped policy gate evaluation (read-only query)
    - GET /compensation-actions/orchestration-coordination — Tenant-scoped orchestration coordination status (read-only query)
    - GET /intents/{intent_id}/orchestration-coordination — Intent-scoped orchestration coordination status (read-only query)
    - POST /compensation-actions/{action_id}/approve — Approve a pending compensation action (bounded slice)
    - POST /compensation-actions/{action_id}/waive — Waive a pending compensation action (bounded slice)
    - POST /compensation-actions/{action_id}/execute — Execute an approved compensation action (bounded slice, stub executor)

    ## Phase 3 Batch 1: Compensation Policy Gate Evaluation
    - **Bounded read-only slice** — no execution, no persistence writes, no policy engine
    - **GET /compensation-actions/policy-gate?tenant_id=...** — Tenant-scoped evaluation for all tenant actions
    - **GET /intents/{intent_id}/compensation-policy-gate?tenant_id=...** — Intent-scoped evaluation
    - **Canonical gate statuses** — exactly: eligible | blocked | manual_review_required
    - **Risk metadata** — derived from existing fields: strategy_severity, retry_exhaustion_risk, feasibility_risk, error_severity, retry_budget_remaining, error_classification, is_terminal, requires_manual_intervention
    - **No new policy engine** — all fields derive from status, attempt_count, max_retries, error_code, feasibility, strategy_type
    - **Policy metadata** — auto_executable, is_dlq_candidate, can_reapprove, retry_budget_exhausted, has_non_retryable_error

    ## Phase 3 Batch 1: Compensation Summary
    - Rebase preview and apply responses include `compensation_planning` field with read-only compensation planning summary
    - `ready: false` in Phase 3 Batch 1 indicates compensation planning is deferred; actual planner/executor are Batch 1+ scope
    - **Bounded execution slice:** approve/waive/execute endpoints implement guarded status transitions
    - **Executor gate:** Only Approved actions can execute; illegal transitions fail closed
    - **Execution policy gate:** Only `Automatic` feasibility can execute; SemiAutomatic/ManualOnly require human intervention workflows (not in this slice); NotPossible cannot be executed at all
    - **Bounded RollbackExecutor (Phase 3 Batch 1):** Real rollback acknowledgment for Rollback+Automatic path
      - Success means "rollback action acknowledged" — validated against side effect ledger
      - Non-Rollback strategies (CounterAction, FollowupNotice, Quarantine, Escalation) fail closed with `UNSUPPORTED_STRATEGY_TYPE`
      - Non-Automatic feasibility (SemiAutomatic, ManualOnly, NotPossible) fail closed with `UNSUPPORTED_FEASIBILITY`
      - Missing side effect context fails closed with `SIDE_EFFECT_NOT_FOUND`
      - Success summary is truthful: "Rollback of {effect_type} targeting {target} acknowledged"
      - Does NOT claim external reversal if current data model cannot support it
    - **Stub executor path:** Non-Rollback+Automatic paths return ExecutionResult failure (not success)

    ## Phase 3 Batch 1: Intent Orchestration Dashboard
    - GET /intents/{intent_id}/orchestration-dashboard — Bounded read-only dashboard endpoint
    - Returns raw lists of side effects and compensation actions for a single intent within a tenant
    - Derives bounded summary fields: counts by status, retryable_failed_count, dlq_candidate_count, reapprovable_count, irreversible-effect flag/count, auto-executable candidate count
    - **This endpoint is READ-ONLY** — does not trigger compensation execution, orchestration engine, or background processing
    - **Truthful summaries** — all counts are derived from persisted data via existing service query helpers
    - No batch execution, no orchestration engine, no background processing claims

    ## Phase 3 Batch 1: Orchestration Coordination Status
    - **Bounded read-only orchestration coordination view** — no execution, no persistence writes, no orchestration engine
    - **GET /compensation-actions/orchestration-coordination?tenant_id=...** — Tenant-scoped coordination status for all tenant actions
    - **GET /intents/{intent_id}/orchestration-coordination?tenant_id=...** — Intent-scoped coordination status
    - **Canonical coordination statuses** — exactly: ready | awaiting_policy | awaiting_manual_review | blocked | terminal
    - **Per-item records** — each action has coordination_status, coordination_reason, and action details
    - **Summary counts** — ready_count, awaiting_policy_count, awaiting_manual_review_count, blocked_count, terminal_count, dlq_candidate_count, auto_executable_count
    - **No new orchestration engine** — all fields derive from existing CompensationAction fields at query time
    - **Response includes** — summary + per-item coordination records

    ## Phase 3 Batch 1: Bounded Manual Retry + DLQ Slice
    - **Manual retry path:** POST /compensation-actions/{action_id}/reapprove transitions Failed → Pending
    - **DLQ query endpoint:** GET /compensation-actions/dlq lists derived DLQ candidates
    - **Derived DLQ condition:** An action is a DLQ candidate when Failed AND (exhausted retry budget OR non-retryable error)
    - **No DLQ table:** DLQ is a read-only derived condition from existing data
    - **Retry policy gates (fail closed):**
      - Only retryable error codes allow reapproval (explicit allowlist: CONNECTION_TIMEOUT, SERVICE_UNAVAILABLE, etc.)
      - Non-retryable errors (INVALID_CONFIGURATION, PERMISSION_DENIED, etc.) cannot be reapproved
      - Exhausted retry budget (attempt_count >= max_retries) cannot be reapproved
      - Default max_retries is 3
    - **Attempt count is preserved** during reapproval (not reset) for audit trail
    - **No background workers** - all operations are explicit API calls

    ## Phase 2b Bounded Delivery
    - Rebase apply endpoint (`POST /intents/{intent_id}/rebase-apply`)
    - Bounded runtime adapter integration for Temporal-backed signal/replay execution
    - Pending approval queue/read endpoints and status-only approve/reject actions
    - Canonical public `risk_tier` field in rebase preview/apply responses
    - Bounded replay endpoint (`POST /intents/{intent_id}/replay`) — cooperative signal-based replay, not native Temporal reset

    ## Still Open (broader than current bounded slices)
    - Checkpoint lifecycle automation and broader checkpoint query/replay APIs
    - Approval revalidation hooks and policy snapshot lifecycle
    - Event streaming (NATS/Kafka)
    - Full authentication/authorization
    - Replay with intent version override (Phase 3 deferral)
    - Replay audit trail and replay status tracking beyond the bounded replay slice (Phase 3 deferral)
    - Compensation planner: full risk scoring, strategy selection (Batch 1+ scope)
    - Compensation executor: real rollback/counter-action logic (Batch 1+ scope; stub executor implemented)
    - Compensation retry logic: max retries, backoff (Batch 1+ scope)
