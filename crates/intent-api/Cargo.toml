[package]
name = "intent-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
intent-service = { path = "../intent-service" }
graph-service = { path = "../graph-service" }
compensation-service = { path = "../compensation-service" }
forensic-service = { path = "../forensic-service" }
intent-rebase-types = { path = "../intent-rebase-types" }
rebase-engine = { path = "../rebase-engine" }
rebase-orchestrator = { path = "../rebase-orchestrator" }
runtime-adapter = { path = "../runtime-adapter" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = "9"

# NATS client (Phase 2b bounded core publisher slice)
# Uses async-nats for proper tokio integration with core publish (no JetStream)
# JetStream streams/consumers/DLQ remain Phase 3 scope
async-nats = "0.47"

# For StreamExt trait (used in NATS consumer poll loop)
futures-util = "0.3"

# OTEL support (optional — inactive unless OTEL_EXPORTER_OTLP_ENDPOINT is set)
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
tracing-opentelemetry = "0.25"

# Webhook delivery client (B4 bounded slice — crate-local only)
# No blocking feature; no workspace promotion.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Full jitter for webhook retry backoff (B4 bounded slice — crate-local only)
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
axum = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
# Environment variable scoping for deterministic parallel tests
temp-env = "0.3"

# Webhook delivery simulation tests (B7 bounded slice — crate-local only)
wiremock = "0.6"

[[bench]]
name = "http_handlers"
harness = false

[[test]]
name = "load_test"
path = "tests/load_test.rs"

[[test]]
name = "rls_integration"
path = "tests/rls_integration.rs"

[features]
default = ["jwt-auth"]
load-test = []
# sqlx-load-test enables SQLx-backed local live load testing
# SQLx types are always available (in regular dependencies)
# This feature is for documentation/future use
sqlx-load-test = []
jwt-auth = []
# temporal enables Temporal runtime adapter support
# Requires TEMPORAL_ADDRESS and TEMPORAL_NAMESPACE env vars to be set when used
# Production Temporal readiness is NOT claimed — trace propagation (W3C) is not supported
temporal = ["runtime-adapter/temporal"]

[[bin]]
name = "intent-api"
path = "src/main.rs"
required-features = []
