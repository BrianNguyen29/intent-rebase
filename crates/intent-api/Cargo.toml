[package]
name = "intent-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
intent-service = { path = "../intent-service" }
graph-service = { path = "../graph-service" }
compensation-service = { path = "../compensation-service" }
forensic-service = { path = "../forensic-service" }
intent-rebase-types = { path = "../intent-rebase-types" }
rebase-engine = { path = "../rebase-engine" }
rebase-orchestrator = { path = "../rebase-orchestrator" }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
validator = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
jsonwebtoken = "9"

# OTEL support (optional — inactive unless OTEL_EXPORTER_OTLP_ENDPOINT is set)
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
tracing-opentelemetry = "0.25"

[dev-dependencies]
runtime-adapter = { path = "../runtime-adapter" }
criterion = { version = "0.5", features = ["html_reports"] }
axum = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }

[[bench]]
name = "http_handlers"
harness = false

[[test]]
name = "load_test"
path = "tests/load_test.rs"

[features]
default = []
load-test = []
# sqlx-load-test enables SQLx-backed local live load testing
# SQLx types are always available (in regular dependencies)
# This feature is for documentation/future use
sqlx-load-test = []
jwt-auth = []
