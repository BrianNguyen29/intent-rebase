[package]
name = "runtime-adapter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
temporal = [
    "dep:futures-util",
    "dep:temporalio-client",
    "dep:temporalio-common",
    "dep:temporalio-sdk-core",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true, optional = true }
temporalio-client = { workspace = true, optional = true }
temporalio-common = { workspace = true, optional = true }
temporalio-sdk-core = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
